syntax = "proto3";

package gfxcafe.oku.account.v2;

import "buf/validate/validate.proto";
import "gfxcafe/oku/account/v1/validate.proto";
import "gfxcafe/oku/account/v2/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gfx.cafe/oku/account/gen/go/gfxcafe/oku/account/v2;accountv2";

// TokenService provides comprehensive token-related functionality
service TokenService {
  // SearchTokens searches for tokens across supported chains
  rpc SearchTokens(SearchTokensRequest) returns (SearchTokensResponse);

  // GetTokenPrice fetches current USD prices for tokens using the oracle
  rpc GetTokenPrice(GetTokenPriceRequest) returns (GetTokenPriceResponse);
}

// SearchTokensRequest for token search
message SearchTokensRequest {
  // Search query string (empty string returns most popular tokens)
  string query = 1;

  // Optional chain IDs to filter results
  repeated int32 chain_ids = 2;

  // Optional chain names to filter results (alternative to chain_ids)
  repeated string chain_names = 3;

  // Maximum number of results (default 10, max 250)
  int32 limit = 4 [(buf.validate.field).int32 = {gte: 1, lte: 250}];

  // Pagination offset
  int32 offset = 5 [(buf.validate.field).int32.gte = 0];

  // Sort by field ("relevance", "name", "symbol", "market_cap", "price", "volume")
  string sort_by = 6;

  // Sort order ("asc", "desc")
  string sort_order = 7;

  // Include price and market data
  bool include_market_data = 8;

  // Filter by tags
  repeated string tags = 9;

  // Bridge filtering: source chain ID
  int32 in_chain_id = 11;

  // Bridge filtering: destination chain ID
  int32 out_chain_id = 12;

  // Bridge filtering: bridge provider names to include (e.g., "lifi", "across")
  repeated string enabled_bridges = 13;

  // Bridge filtering: input token address (if set, fetches supported out tokens; if empty, fetches supported in tokens)
  string in_token_address = 14;

  // Optional chain identifiers to filter results (chain id, internal name, or CAIP-2; alternative to chain_ids)
  repeated string chains = 15;

  // Bridge filtering: source chain identifier (chain id, internal name, or CAIP-2; takes precedence over in_chain_id)
  string in_chain = 16;

  // Bridge filtering: destination chain identifier (chain id, internal name, or CAIP-2; takes precedence over out_chain_id)
  string out_chain = 17;
}

// SearchTokensResponse with token results
message SearchTokensResponse {
  // List of matching tokens with search metadata
  repeated TokenSearchResult results = 1;

  // Total number of hits
  int32 total_hits = 2;

  // Current offset
  int32 offset = 3;

  // Limit used
  int32 limit = 4;

  // Search time in milliseconds
  int64 search_time_ms = 5;

  // Total number of documents in the index (regardless of query)
  int32 total_documents = 6;
}

// TokenIdentifier represents a token address and chain combination
message TokenIdentifier {
  // Token address
  string address = 1 [
    (buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true
  ];

  // Chain ID
  int32 chain_id = 2 [(buf.validate.field).int32.gt = 0];
}

// TokenInfo represents core token information from the tokenlist
message TokenInfo {
  // Token address
  string address = 1;

  // Token symbol
  string symbol = 2;

  // Token name
  string name = 3;

  // Number of decimals
  int32 decimals = 4;

  // Chain ID
  int32 chain_id = 5;

  // Token logo URL (optional)
  string logo_url = 6;

  // Chain name
  string chain_name = 7;

  // CAIP-2 chain identifier (e.g. "eip155:1")
  string chain = 8;
}

// TokenSearchResult represents a token with search metadata and extended information
message TokenSearchResult {
  // Core token information
  TokenInfo token = 1;

  // Relevance/popularity score
  float score = 2;

  // Token description
  string description = 3;

  // Token tags
  repeated string tags = 4;

  // Market data (if requested)
  TokenMarketData market_data = 5;

  // Additional metadata
  map<string, string> metadata = 6;

  // Is native token
  bool is_native = 7;

  // Is supported for trading
  bool is_supported = 8;

  // Last update timestamp
  int64 last_update_unix = 9;

  // Search highlights (for search results)
  TokenHighlight highlights = 10;
}


// TokenMarketData contains market information for a token
message TokenMarketData {
  // Market cap in USD
  double market_cap_usd = 1;

  // Price in USD
  double price_usd = 2;

  // 24h price change percentage
  double price_change_24h = 3;

  // 24h volume in USD
  double volume_24h = 4;

  // Total value locked in USD
  double tvl_usd = 5;

  // Last update timestamp
  int64 last_update_unix = 6;
}

// TokenHighlight contains highlighted snippets for a token
message TokenHighlight {
  // Highlighted name
  repeated string name = 1;

  // Highlighted symbol
  repeated string symbol = 2;

  // Highlighted description
  repeated string description = 3;
}

// GetTokenPriceRequest for fetching token prices from the oracle
message GetTokenPriceRequest {
  // List of tokens to fetch prices for (use 0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE for native token per EIP-7528)
  repeated ChainAddress tokens = 1 [
    (buf.validate.field).repeated = {min_items: 1, max_items: 25}
  ];

  // Optional historic timestamp. When set, prices are fetched as of this time
  // and only oracles supporting historic pricing are queried.
  optional google.protobuf.Timestamp timestamp = 2;

  // When true, bypass the price cache and fetch fresh quotes from the
  // oracles. The fresh results still refresh the cache.
  bool skip_cache = 3;
}

// ChainAddress identifies a token by chain and address
message ChainAddress {
  // Chain identifier. Accepts a numeric chain ID ("1"), an internal chain name
  // ("ethereum"), or a CAIP-2 identifier ("eip155:1").
  string chain = 1 [(buf.validate.field).string.min_len = 1];

  // Token address
  string address = 2 [
    (buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true
  ];
}

// GetTokenPriceResponse containing token prices
message GetTokenPriceResponse {
  // Token price results in same order as request
  repeated TokenPriceResult results = 1;
}

// TokenPriceResult contains price data or an error
message TokenPriceResult {
  // Resolved CAIP-2 chain identifier (e.g. "eip155:1"). Falls back to the raw
  // request value when the chain could not be resolved (error is then set).
  string chain = 1;

  // Token address
  string address = 2;

  // Price in USD (present if fetch succeeded)
  double price_usd = 3;

  // Price timestamp in Unix milliseconds (present if fetch succeeded)
  int64 timestamp = 4;

  // Error message (present if fetch failed)
  string error = 5;

  // Oracle source that produced the price (e.g. "stablecoin", "onchain",
  // "uniblock", "ICS", "oku"); empty when no oracle returned a valid price,
  // in which case error is set
  string source = 6;

  // Whether the price was served from cache rather than fetched live
  bool cache_hit = 7;

  // Token decimals (present if fetch succeeded)
  int32 token_decimals = 8;
}
