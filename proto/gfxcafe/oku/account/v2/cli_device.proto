syntax = "proto3";

package gfxcafe.oku.account.v2;

option go_package = "gfx.cafe/oku/account/gen/go/gfxcafe/oku/account/v2;accountv2";

import "buf/validate/validate.proto";
import "gfxcafe/oku/account/v1/validate.proto";
import "google/protobuf/timestamp.proto";

// CliDeviceService enrolls Oku CLI devices. A device receives a narrow,
// revocable, account-bound token (header x-oku-device-token) that is accepted
// only by an allowlist of PerpsService operations and the device-self methods
// below. It never receives the user's wallet key or browser session.
//
// Browser methods (session auth): StartEnrollment, GetEnrollment,
// ApproveEnrollment, DenyEnrollment, ListDevices, RevokeDevice.
// CLI methods (no auth): RedeemEnrollment, PollEnrollment.
// Device methods (device token): GetCurrentDevice, RevokeCurrentDevice.
//
// Revocation only disables the Oku API token. It does not revoke the
// Hyperliquid agent approval, cancel orders, or close positions.
service CliDeviceService {
  rpc StartEnrollment(StartCliEnrollmentRequest) returns (StartCliEnrollmentResponse);
  rpc GetEnrollment(GetCliEnrollmentRequest) returns (GetCliEnrollmentResponse);
  rpc VerifyEnrollment(VerifyCliEnrollmentRequest) returns (VerifyCliEnrollmentResponse);
  rpc ApproveEnrollment(ApproveCliEnrollmentRequest) returns (ApproveCliEnrollmentResponse);
  rpc DenyEnrollment(DenyCliEnrollmentRequest) returns (DenyCliEnrollmentResponse);
  rpc ListDevices(ListCliDevicesRequest) returns (ListCliDevicesResponse);
  rpc RevokeDevice(RevokeCliDeviceRequest) returns (RevokeCliDeviceResponse);

  rpc RedeemEnrollment(RedeemCliEnrollmentRequest) returns (RedeemCliEnrollmentResponse);
  rpc PollEnrollment(PollCliEnrollmentRequest) returns (PollCliEnrollmentResponse);

  rpc GetCurrentDevice(GetCurrentCliDeviceRequest) returns (GetCurrentCliDeviceResponse);
  rpc RevokeCurrentDevice(RevokeCurrentCliDeviceRequest) returns (RevokeCurrentCliDeviceResponse);
}

message CliDevice {
  string device_id = 1;
  string device_name = 2;
  string agent_address = 3;
  string account_address = 4;
  repeated string scopes = 5;
  string status = 6; // active | revoked
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_used_at = 8;
  google.protobuf.Timestamp revoked_at = 9;
}

message CliEnrollment {
  string enrollment_id = 1;
  // pending_redeem | pending_approval | device_verified | approved | denied | expired | claimed
  string status = 2;
  string account_address = 3;
  repeated string scopes = 4;
  string device_name = 5;
  string agent_address = 6;
  google.protobuf.Timestamp expires_at = 7;
  string device_id = 8;
}

message StartCliEnrollmentRequest {
  string account_address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  repeated string scopes = 2 [(buf.validate.field).repeated = {
    max_items: 3
    items: {string: {in: ["read", "trade", "risk"]}}
  }];
  // Must be "oku-cli-v1" when trade or risk scope is requested.
  string disclosures_version = 3;
  // Explicit browser risk acceptance, required for trade or risk scope.
  // "risk" (leverage and isolated margin changes) is a separate opt-in: it
  // does not imply "trade" and "trade" does not imply it.
  bool accepted_risk = 4;
}

message StartCliEnrollmentResponse {
  string enrollment_id = 1;
  // One-time code, shown once. Format XXXX-XXXX-XXXX-XXXX.
  string enrollment_code = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message GetCliEnrollmentRequest {
  string enrollment_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetCliEnrollmentResponse {
  CliEnrollment enrollment = 1;
}

// VerifyEnrollment proves the browser user sees the actual CLI device. It
// issues no token and must succeed before any HL agent approval is signed.
message VerifyCliEnrollmentRequest {
  string enrollment_id = 1 [(buf.validate.field).string.uuid = true];
  string agent_address = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  string confirmation_code = 3 [(buf.validate.field).string.pattern = "^[0-9]{6}$"];
}

message VerifyCliEnrollmentResponse {
  CliEnrollment enrollment = 1;
}

// ApproveEnrollment requires status device_verified. For trade scope the
// agent must already be approved on Hyperliquid for the account.
message ApproveCliEnrollmentRequest {
  string enrollment_id = 1 [(buf.validate.field).string.uuid = true];
}

message ApproveCliEnrollmentResponse {
  CliEnrollment enrollment = 1;
}

message DenyCliEnrollmentRequest {
  string enrollment_id = 1 [(buf.validate.field).string.uuid = true];
}

message DenyCliEnrollmentResponse {
  CliEnrollment enrollment = 1;
}

message ListCliDevicesRequest {}

message ListCliDevicesResponse {
  repeated CliDevice devices = 1;
}

message RevokeCliDeviceRequest {
  string device_id = 1 [(buf.validate.field).string.uuid = true];
}

message RevokeCliDeviceResponse {
  CliDevice device = 1;
}

message RedeemCliEnrollmentRequest {
  string enrollment_code = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string agent_address = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  string device_name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  // 0x-prefixed 65-byte EIP-191 personal_sign signature by the agent key.
  string signature = 4 [(buf.validate.field).string = {min_len: 1, max_len: 200}];
}

message RedeemCliEnrollmentResponse {
  string enrollment_id = 1;
  // Secret used only for PollEnrollment. Returned once.
  string poll_secret = 2;
  // Six digits the user must confirm in the browser.
  string confirmation_code = 3;
  google.protobuf.Timestamp expires_at = 4;
  int32 poll_interval_seconds = 5;
}

message PollCliEnrollmentRequest {
  string enrollment_id = 1 [(buf.validate.field).string.uuid = true];
  string poll_secret = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message PollCliEnrollmentResponse {
  // pending_approval | device_verified | approved | denied | expired | claimed
  string status = 1;
  string device_id = 2;
  // Returned exactly once, on the poll that claims the approved enrollment.
  string device_token = 3;
  repeated string scopes = 4;
  string account_address = 5;
}

message GetCurrentCliDeviceRequest {}

message GetCurrentCliDeviceResponse {
  CliDevice device = 1;
}

message RevokeCurrentCliDeviceRequest {}

message RevokeCurrentCliDeviceResponse {
  CliDevice device = 1;
}
