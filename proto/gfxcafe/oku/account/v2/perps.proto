syntax = "proto3";

package gfxcafe.oku.account.v2;

import "buf/validate/validate.proto";
import "gfxcafe/oku/account/v1/validate.proto";
import "gfxcafe/oku/account/v2/validate.proto";

option go_package = "gfx.cafe/oku/account/gen/go/gfxcafe/oku/account/v2;accountv2";

// ============================================================================
// Service Definition
// ============================================================================

// PerpsService provides perpetual futures trading operations powered by Hyperliquid.
service PerpsService {
  // ---- Market Data (no auth required) ----

  // GetMarkets returns all available perpetual markets with metadata and live stats.
  // Pass optional coin filter to get a single market.
  rpc GetMarkets(GetMarketsRequest) returns (GetMarketsResponse);

  // GetMarketPrice returns current prices for a single perp market. Served from
  // a short-lived server-side cache shared across all users, so it is safe to
  // poll frequently. Use this instead of GetMarkets when only prices are needed.
  rpc GetMarketPrice(GetMarketPriceRequest) returns (GetMarketPriceResponse);

  // GetMarketFundingHistory returns the market-wide funding rate history.
  rpc GetMarketFundingHistory(GetMarketFundingHistoryRequest) returns (GetMarketFundingHistoryResponse);

  // GetPerpPositions returns perp positions and margin summaries aggregated
  // across all supported Hyperliquid perp interfaces. Cheap on Hyperliquid rate
  // limits (weight 2 per interface) -- safe to poll frequently.
  rpc GetPerpPositions(GetPerpPositionsRequest) returns (GetPerpPositionsResponse);

  // GetOpenOrders returns open orders across all supported Hyperliquid perp
  // interfaces. Heavier than GetPerpPositions (weight 20 per interface); poll
  // at a slower cadence and invalidate on order actions/fills.
  rpc GetOpenOrders(GetOpenOrdersRequest) returns (GetOpenOrdersResponse);

  // GetAccountBalances returns spot and separate Standard-mode perps balances.
  // This may fan out across supported HIP-3 DEXs; poll slowly and invalidate
  // after deposits, withdrawals, transfers, and spot conversions.
  rpc GetAccountBalances(GetAccountBalancesRequest) returns (GetAccountBalancesResponse);

  // GetBuilderFeeStatus returns the user's builder fee approval status and
  // Oku's builder fee configuration. Approval flips at most once per account --
  // fetch once per session and invalidate after ApproveBuilderFee.
  rpc GetBuilderFeeStatus(GetBuilderFeeStatusRequest) returns (GetBuilderFeeStatusResponse);

  // ---- Trading (auth required) ----
  // Flow: CreateAction -> (optionally UpdateAction to change params) -> ConfirmAction with signature.
  // Each action is a Temporal workflow session. The workflow builds the HL action payload,
  // allows parameter iteration, then submits to HL on confirmation and tracks completion.

  // CreateAction starts an action workflow session and builds the HL action payload.
  // The action is NOT submitted to HL yet -- call ConfirmAction with the signed payload.
  rpc CreateAction(CreateActionRequest) returns (ActionPayloadResponse);

  // ConfirmAction submits the signed action to Hyperliquid.
  // The workflow then tracks the action's lifecycle (fills, cancellation, etc.).
  rpc ConfirmAction(ConfirmActionRequest) returns (ConfirmActionResponse);

  // CancelAction cancels a pending or in-flight action.
  // For unconfirmed actions, just abandons the workflow.
  // For confirmed orders, submits a signed cancel to HL.
  rpc CancelAction(CancelActionRequest) returns (CancelActionResponse);

  // GetAction returns the current state of an action by its ID.
  // Used by the frontend to poll for action completion after ConfirmAction.
  rpc GetAction(GetActionRequest) returns (GetActionResponse);

  // ReconcileActions refreshes submitted actions from Hyperliquid and persists
  // any terminal statuses/fills. Use this when reconnecting or explicitly
  // refreshing long-lived resting orders.
  rpc ReconcileActions(ReconcileActionsRequest) returns (ReconcileActionsResponse);

  // ValidateAgentKey checks whether an agent wallet is approved on Hyperliquid
  // for the authenticated user.
  rpc ValidateAgentKey(ValidateAgentKeyRequest) returns (ValidateAgentKeyResponse);

  // GetUserFills returns the user's most recent fills live from Hyperliquid (userFills), newest first.
  rpc GetUserFills(GetUserFillsRequest) returns (GetUserFillsResponse);

  // ---- Deposits ----

  // GetDepositTokens returns tokens that can be deposited to Hyperliquid,
  // including bridge contract details, chain info, and minimum amounts.
  rpc GetDepositTokens(GetDepositTokensRequest) returns (GetDepositTokensResponse);

  // GenerateDepositAddress generates a unique deposit address via HyperUnit
  // for depositing native assets (BTC, ETH, SOL, etc.) to Hyperliquid.
  // The address is permanently tied to the user's HL address.
  rpc GenerateDepositAddress(GenerateDepositAddressRequest) returns (GenerateDepositAddressResponse);
}

// ============================================================================
// Core Types
// ============================================================================

// PerpMarket represents a perpetual futures market.
message PerpMarket {
  string coin = 1;
  int32 sz_decimals = 2;
  int32 max_leverage = 3;
  bool only_isolated = 4;
  int32 asset_id = 6;             // exchange asset id used in signed actions

  // Live context (populated when available)
  string mark_px = 10;
  string oracle_px = 11;
  string mid_px = 12;
  string funding = 13;
  string open_interest = 14;
  string prev_day_px = 15;
  string day_ntl_vlm = 16;
  string premium = 17;

  string display_name = 18;       // human-readable name from HL annotations; falls back to coin
  repeated string keywords = 19;

  // mark_px * shares outstanding, USD. Equity markets only; empty when the
  // share count is unknown.
  string implied_market_cap = 20;

  // UNSPECIFIED when HL gives no usable category; clients should not guess.
  PerpMarketCategory category = 21;
}

enum PerpMarketCategory {
  PERP_MARKET_CATEGORY_UNSPECIFIED = 0;
  PERP_MARKET_CATEGORY_CRYPTO = 1;
  PERP_MARKET_CATEGORY_STOCK = 2;
  PERP_MARKET_CATEGORY_ETF = 3;
  PERP_MARKET_CATEGORY_COMMODITY = 4;
  PERP_MARKET_CATEGORY_FOREX = 5;
  PERP_MARKET_CATEGORY_INDEX = 6;
}

// PerpPosition represents an open perpetual position.
message PerpPosition {
  string coin = 1;
  string szi = 2;             // signed size (negative = short)
  string entry_px = 3;
  string position_value = 4;
  string unrealized_pnl = 5;
  string return_on_equity = 6;
  string liquidation_px = 7;  // empty if no liquidation price
  string leverage_type = 8;   // "cross" or "isolated"
  int32 leverage_value = 9;
  string margin_used = 10;
  string cum_funding_all_time = 11;
  string cum_funding_since_open = 12;
}

// PerpOrder represents an open order.
message PerpOrder {
  string coin = 1;
  string limit_px = 2;
  int64 oid = 3;
  string side = 4;            // "B" (buy) or "A" (sell)
  string sz = 5;
  int64 timestamp = 6;
  string orig_sz = 7;
  string cloid = 8;
  string order_type = 9;
  string trigger_px = 10;
  string trigger_condition = 11;
  bool is_trigger = 12;
  bool reduce_only = 13;
  bool is_position_tpsl = 14;     // HL grouping "positionTpsl"; closes whole position, sz is "0"
  int32 asset_id = 15;            // exchange asset id when known
  string tif = 16;                // time-in-force: "Gtc", "Ioc", "Alo"
  repeated PerpOrder children = 17; // nested TP/SL orders attached to this order
}

// PerpTrade represents a trade fill.
message PerpTrade {
  string coin = 1;
  string px = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true];
  string sz = 3 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true];
  string side = 4;
  int64 time = 5;
  string dir = 6;             // "Open Long", "Close Long", "Open Short", "Close Short"
  string closed_pnl = 7;
  string hash = 8;
  int64 oid = 9;
  bool crossed = 10;
  string fee = 11;
  int64 tid = 12;
  string fee_token = 13;
  string start_position = 14; // position size before this fill
  string builder_fee = 15;    // builder fee amount (separate from trading fee)
  PerpTradeKind kind = 16;
  PerpLiquidation liquidation = 17;
  int64 twap_id = 18;         // HL TWAP id this fill belongs to; 0 when not a TWAP fill
}

enum PerpTradeKind {
  PERP_TRADE_KIND_UNSPECIFIED = 0;
  PERP_TRADE_KIND_NORMAL = 1;
  PERP_TRADE_KIND_LIQUIDATION = 2;
  PERP_TRADE_KIND_AUTO_DELEVERAGED = 3;
}

message PerpLiquidation {
  string liquidated_user = 1;
  string mark_px = 2;
  string method = 3;
}

// MarginSummary contains margin/balance information.
message PerpsMarginSummary {
  string account_value = 1;
  string total_ntl_pos = 2;
  string total_raw_usd = 3;
  string total_margin_used = 4;
}

// SignedAction wraps a pre-signed Hyperliquid exchange action.
// The action, nonce, and signature are produced by the user's wallet or approved agent.
message EVMSignature {
  string r = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^0x[0-9a-fA-F]{64}$"];
  string s = 2 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^0x[0-9a-fA-F]{64}$"];
  optional uint64 v = 3 [(buf.validate.field).required = true, (buf.validate.field).uint64 = {in: [0, 1, 27, 28]}];
}

message SignedAction {
  string action_json = 1 [(buf.validate.field).required = true]; // raw JSON with key order preserved for msgpack signing
  int64 nonce = 2 [(buf.validate.field).required = true];
  EVMSignature signature = 3 [(buf.validate.field).required = true];
  string vault_address = 4;  // optional, for subaccount trading
}

// ============================================================================
// Market Data Request/Response
// ============================================================================

// ----------------------------------------------------------------------------
// GetMarkets
// ----------------------------------------------------------------------------

message GetMarketsRequest {
  string coin = 1; // optional filter: if set, returns only this market
  string dex = 2;  // optional perp dex; empty means default Hyperliquid perps
}

message GetMarketsResponse {
  repeated PerpMarket markets = 1;
}

// ----------------------------------------------------------------------------
// GetMarketPrice
// ----------------------------------------------------------------------------

message GetMarketPriceRequest {
  string coin = 1 [(buf.validate.field).required = true]; // canonical market id, e.g. "BTC" or "xyz:AAPL"
}

message GetMarketPriceResponse {
  string coin = 1;
  string mark_px = 2;   // Hyperliquid mark price (used for PnL/liquidations)
  string mid_px = 3;    // book mid price; may be empty
  string oracle_px = 4; // oracle price
}

message GetMarketFundingHistoryRequest {
  string coin = 1 [(buf.validate.field).required = true];
  int64 start_time = 2 [(buf.validate.field).required = true];
  int64 end_time = 3;
}

message PerpFundingRate {
  int64 time = 1;
  string funding_rate = 2;
  string premium = 3;
}

message GetMarketFundingHistoryResponse {
  repeated PerpFundingRate rates = 1;
}

message SpotBalance {
  string coin = 1;
  int32 token = 2;
  string total = 3;
  string hold = 4;
}

// PerpsBalance contains the default validator-operated perps USDC balance.
// In Standard mode this balance is separate from spot and HIP-3 DEX balances.
message PerpsBalance {
  string account_value = 1;
  string withdrawable = 2;
  string margin_used = 3;
}

// PerpsDexBalance contains a Standard-mode HIP-3 DEX balance.
message PerpsDexBalance {
  string dex = 1;
  string account_value = 2;
  string withdrawable = 3;
  string margin_used = 4;
}

// ----------------------------------------------------------------------------
// GetPerpPositions
// ----------------------------------------------------------------------------

message GetPerpPositionsRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
}

message GetPerpPositionsResponse {
  // Margin summaries aggregated across the default and supported HIP-3 perp interfaces.
  PerpsMarginSummary margin_summary = 1;
  PerpsMarginSummary cross_margin_summary = 2;
  // Aggregated perps-clearinghouse withdrawable. Unified accounts hold USDC in
  // spot: see GetAccountBalances.spot_usdc_withdrawable for spot withdrawable.
  string withdrawable = 3;
  string cross_maintenance_margin_used = 4;

  // Open positions across all Hyperliquid perp interfaces.
  repeated PerpPosition positions = 5;
}

// ----------------------------------------------------------------------------
// GetOpenOrders
// ----------------------------------------------------------------------------

message GetOpenOrdersRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];

  // Bypass the server-side cache and fetch fresh from Hyperliquid. The cache
  // is refreshed automatically when order executions tracked by Oku finish;
  // use this for explicit user-triggered refreshes.
  bool skip_cache = 2;
}

message GetOpenOrdersResponse {
  // Open orders across all Hyperliquid perp interfaces.
  repeated PerpOrder open_orders = 1;
}

// ----------------------------------------------------------------------------
// GetAccountBalances
// ----------------------------------------------------------------------------

message GetAccountBalancesRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];

  // Bypass the server-side account-mode cache and fetch fresh from
  // Hyperliquid. The mode can be changed on Hyperliquid's own UI; use this on
  // first load and for explicit user-triggered refreshes.
  bool skip_cache = 2;
}

message GetAccountBalancesResponse {
  // All HyperCore spot balances. HyperUnit deposits land here as their native
  // asset (e.g. ETH), not perps margin.
  repeated SpotBalance spot_balances = 1;

  // Spot USDC balance (unified accounts hold USDC in spot, not perps clearinghouse).
  string spot_usdc_balance = 2;

  // Spot USDC total minus hold; empty when the account has no spot USDC balance.
  string spot_usdc_withdrawable = 3;

  // Default validator-operated perps balance in Standard mode.
  PerpsBalance perps_balance = 4;

  // Separate balances for supported HIP-3 DEXs in Standard mode.
  repeated PerpsDexBalance hip3_balances = 5;

  // Hyperliquid account mode used to interpret whether spot and perps balances
  // are separate.
  string account_abstraction = 6;
}

// ----------------------------------------------------------------------------
// GetBuilderFeeStatus
// ----------------------------------------------------------------------------

message GetBuilderFeeStatusRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
}

message GetBuilderFeeStatusResponse {
  int32 builder_fee_ppm = 1; // max approved fee in parts per million (0 = not approved)
  bool builder_fee_approved = 2;
  string builder_address = 3;

  // Builder fee config advertised by Oku. The charged fee is attached to orders;
  // the approval target is the max fee users should approve on Hyperliquid.
  int32 builder_fee_charged_ppm = 4;
  int32 builder_fee_approval_target_ppm = 5;
}

// ============================================================================
// Trading Request/Response
// ============================================================================

// ActionParams contains the action-specific parameters, shared by Create and Update.
message ActionParams {
  reserved 11;
  reserved "set_unified_account";

  oneof metadata {
    OrderActionMetadata order = 1;
    CancelActionMetadata cancel = 2;
    ModifyActionMetadata modify = 3;
    TWAPActionMetadata twap = 4;
    CancelTWAPActionMetadata cancel_twap = 5;
    LeverageActionMetadata leverage = 6;
    MarginActionMetadata margin = 7;
    ScaleActionMetadata scale = 8;
    CancelOrdersActionMetadata cancel_orders = 9;
    ConvertToUsdcActionMetadata convert_to_usdc = 10;
    TrailingStopActionMetadata trailing_stop = 12;
  }
}

// ----------------------------------------------------------------------------
// CreateAction - starts an action workflow session
// ----------------------------------------------------------------------------

message CreateActionRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  ActionParams params = 2 [(buf.validate.field).required = true];
}

message ActionPayloadResponse {
  string action_id = 1;              // our internal tracking UUID
  string action_type = 2;            // "order", "cancel", "modify", etc.
  string status = 3;                 // "pending" (awaiting signature)
  string action_json = 4;            // raw JSON with key order preserved for msgpack signing
  int32 asset_index = 5;             // resolved index in dex-specific meta universe
  int32 asset_id = 6;                // exchange asset id used in signed actions
}

// ----------------------------------------------------------------------------
// ConfirmAction - submit signed action to Hyperliquid
// ----------------------------------------------------------------------------

message ConfirmActionRequest {
  string action_id = 1 [(buf.validate.field).required = true];
  SignedAction signed_action = 2 [(buf.validate.field).required = true];
}

message ConfirmActionResponse {
  string status = 1;          // "submitted", "filled", "completed", "error"
  int64 hl_oid = 2;           // Hyperliquid order ID (for order/modify/trailing_stop actions)
  string error_message = 3;
}

// ----------------------------------------------------------------------------
// CancelAction - cancel a pending or in-flight action
// ----------------------------------------------------------------------------

message CancelActionRequest {
  string action_id = 1 [(buf.validate.field).required = true];
  SignedAction signed_action = 2; // required only for confirmed orders (HL needs signed cancel)
}

message CancelActionResponse {
  string status = 1;
}

// ----------------------------------------------------------------------------
// GetAction - retrieve current state of an action
// ----------------------------------------------------------------------------

message GetActionRequest {
  string action_id = 1 [(buf.validate.field).required = true];
}

message ReconcileActionsRequest {
  repeated string action_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
    items: {string: {min_len: 1}}
  }];
}

message ReconcileActionsResponse {
  repeated GetActionResponse actions = 1;
}

message GetActionResponse {
  string action_id = 1;
  string action_type = 2;    // "order", "leverage", "margin", "cancel", etc.
  string state = 3;           // "pending", "submitted", "completed", "filled", "cancelled", "error"
  int64 hl_oid = 4;           // Hyperliquid order ID (if applicable)
  string error_message = 5;   // error details (if state == "error")
}

// ----------------------------------------------------------------------------
// ValidateAgentKey - check if an agent wallet is approved on Hyperliquid
// ----------------------------------------------------------------------------

message ValidateAgentKeyRequest {
  string agent_address = 1 [(buf.validate.field).required = true];
  string user_address = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
}

message ValidateAgentKeyResponse {
  bool valid = 1;
  // status is derived from Hyperliquid userRole:
  // "approved", "missing", "wrong_user", "not_agent", or "unknown".
  string status = 2;
  string approved_user = 3;
  string role = 4;
}

// ---- Action Metadata Variants ----

// OrderActionMetadata is metadata for placing an order.
message OrderActionMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  string side = 2 [(buf.validate.field).required = true];        // "buy" or "sell"
  string order_type = 3 [(buf.validate.field).required = true];  // "limit", "market", "stop_market", "stop_limit", "take_market", "take_limit"
  string sz = 4 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string limit_px = 6 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string trigger_px = 7 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string tif = 8;             // "GTC", "IOC", "ALO"
  bool reduce_only = 9;
  int32 slippage_bps = 10;   // slippage tolerance in basis points, e.g. 100 = 1%, 50 = 0.5%

  // TP/SL configuration (optional, creates grouped orders)
  string take_profit_px = 11 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string stop_loss_px = 12 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string tp_limit_px = 13 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string sl_limit_px = 14 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string tp_sz = 15 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string sl_sz = 16 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string cloid = 17;          // client order ID (optional, 128-bit hex string)
  int32 leverage = 18 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  bool close_position = 19;   // trigger order types only: HL grouping "positionTpsl", sz sent as "0"
}

// ConvertToUsdcActionMetadata sells a HyperCore token balance into spot USDC.
// The backend resolves the TOKEN/USDC spot pair and builds an IOC sell order.
message ConvertToUsdcActionMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  string sz = 2 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  int32 slippage_bps = 3; // slippage tolerance in basis points, e.g. 100 = 1%
}

// CancelActionMetadata is metadata for cancelling an order.
message CancelActionMetadata {
  string action_id = 1;       // our internal action UUID of the order being cancelled (optional)
  string coin = 2;
  int64 oid = 3;              // HL order ID to cancel
}

message CancelOrderItem {
  string coin = 1;
  int64 oid = 2;
}

// CancelOrdersActionMetadata is metadata for cancelling multiple open orders in
// a single Hyperliquid cancel action.
message CancelOrdersActionMetadata {
  repeated CancelOrderItem orders = 1;
}

// TriggerOrderType distinguishes take-profit from stop-loss in trigger order metadata.
enum TriggerOrderType {
  TRIGGER_ORDER_TYPE_UNSPECIFIED = 0;
  TRIGGER_ORDER_TYPE_TAKE_PROFIT = 1;
  TRIGGER_ORDER_TYPE_STOP_LOSS = 2;
}

// ModifyActionMetadata is metadata for modifying existing orders via Hyperliquid
// batchModify. Each item is a complete replacement order. Hyperliquid performs a
// server-side cancel-and-replace, so every field of the replacement OrderSpec must
// be provided.
message ModifyActionMetadata {
  repeated ModifyOrderMetadata modifies = 1 [(buf.validate.field).repeated.min_items = 1];
}

// ModifyOrderMetadata describes a single order replacement within a batchModify.
message ModifyOrderMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  int64 oid = 2 [(buf.validate.field).int64.gt = 0];  // HL order ID to replace
  string size = 3 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string limit_px = 4 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  // Set for a TP/SL (trigger) modify; leave empty to reprice a plain limit order.
  string trigger_px = 5 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  // Required only when trigger_px is set.
  TriggerOrderType tpsl = 6 [(buf.validate.field).enum.defined_only = true];
  bool is_buy = 7;
  bool is_market = 8;
  optional string cloid = 9;
  // Plain-limit reprice only (trigger_px empty): "GTC", "IOC", or "ALO". Defaults to GTC.
  string tif = 10 [(buf.validate.field).string = {in: ["", "GTC", "IOC", "ALO"]}];
  // Plain-limit reprice only (trigger_px empty). Trigger modifies are always reduce-only.
  bool reduce_only = 11;
}

// TWAPActionMetadata is metadata for placing a TWAP order.
// Builds a Hyperliquid twapOrder action. Fields: coin is the market symbol,
// side is "buy" or "sell", sz is base-asset size, duration_minutes is the
// total TWAP duration, randomize enables randomized slicing, and reduce_only
// ensures the TWAP only reduces an existing position.
message TWAPActionMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  string side = 2 [(buf.validate.field).required = true];
  string sz = 3 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  int32 duration_minutes = 4;
  bool randomize = 5;
  bool reduce_only = 6;

  string trigger_px = 7 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  bool trigger_activate_above = 8;
  string stop_px = 9 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
}

// TrailingStopActionMetadata is metadata for placing a trailing stop.
// Builds a Hyperliquid trailingStop action: a market order that fires when the
// mark price retraces from its best level since activation by the retracement.
// side is the side of the resulting market order ("sell" closes a long).
message TrailingStopActionMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  string side = 2 [(buf.validate.field).required = true];
  string sz = 3 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  bool reduce_only = 4;
  // Mark price at which tracking starts. Empty starts tracking immediately.
  string activation_px = 5 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  // Exactly one of retracement_pct or retracement_px must be set.
  // Percent of the watermark, e.g. "5" or "2.5". At most 4 decimal places.
  string retracement_pct = 6 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  // Fixed price distance from the watermark.
  string retracement_px = 7 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
}

// ScaleActionMetadata is metadata for placing a scale order. Scale orders are
// expanded into multiple Hyperliquid limit child orders in a single order
// action. size_skew is final_child_size / first_child_size; 1 means equal size.
message ScaleActionMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  string side = 2 [(buf.validate.field).required = true];
  string sz = 3 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string start_px = 5 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string end_px = 6 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  int32 total_orders = 7;
  string size_skew = 8 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string tif = 9;             // "GTC", "IOC", "ALO"
  bool reduce_only = 10;
}

// CancelTWAPActionMetadata is metadata for cancelling a TWAP order.
message CancelTWAPActionMetadata {
  string coin = 1;
  int64 twap_id = 2;
}

// LeverageActionMetadata is metadata for updating leverage.
message LeverageActionMetadata {
  string coin = 1;
  int32 leverage = 2;
  bool is_cross = 3;
}

// MarginActionMetadata is metadata for updating isolated margin.
message MarginActionMetadata {
  string coin = 1;
  string amount = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v2.signed_decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_signed_decimal_string) = true];          // amount to add/remove (negative to remove)
}

message GetUserFillsRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];

  bool skip_cache = 2;

  string coin = 3;
}

message GetUserFillsResponse {
  repeated PerpTrade fills = 1;
}

// ============================================================================
// Deposit Tokens + Transaction Building
// ============================================================================

// ----------------------------------------------------------------------------
// GetDepositTokens
// ----------------------------------------------------------------------------

message GetDepositTokensRequest {}

message DepositToken {
  string symbol = 1;
  string address = 2;              // token contract address on the source chain
  int64 chain_id = 3;              // source chain (e.g., 42161 for Arbitrum)
  string chain = 4;                // CAIP-2 chain identifier, e.g. "eip155:42161"
  int32 decimals = 5;
  string min_deposit = 6;          // minimum deposit amount
}

message GetDepositTokensResponse {
  repeated DepositToken tokens = 1;
}

// ----------------------------------------------------------------------------
// GenerateDepositAddress (via HyperUnit)
// ----------------------------------------------------------------------------

message GenerateDepositAddressRequest {
  string hl_address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  string asset = 2 [(buf.validate.field).required = true];       // asset symbol: "btc", "eth", "sol", "avax", etc.
  string source_chain = 3 [(buf.validate.field).string.(gfxcafe.oku.account.v2.caip2) = true]; // CAIP-2: "bip122:000000000019d6689c085ae165831e93" (bitcoin), "eip155:1" (ethereum), "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp", etc.
}

message GenerateDepositAddressResponse {
  string deposit_address = 1;      // address on the source chain to send assets to
  string asset = 2;                // asset symbol
  string source_chain = 3;         // CAIP-2 chain identifier (echo back)
  string min_deposit = 4;          // minimum deposit amount for this asset
  string hl_address = 5;           // the HL address this deposit address is tied to
}
