}

message GetBuilderFeeStatusResponse {
  int32 builder_fee_ppm = 1; // max approved fee in parts per million (0 = not approved)
  bool builder_fee_approved = 2;
  string builder_address = 3;

  // Builder fee config advertised by Oku. The charged fee is attached to orders;
  // the approval target is the max fee users should approve on Hyperliquid.
  int32 builder_fee_charged_ppm = 4;
  int32 builder_fee_approval_target_ppm = 5;
}

// ============================================================================
// Trading Request/Response
// ============================================================================

// ActionParams contains the action-specific parameters, shared by Create and Update.
message ActionParams {
  reserved 11;
  reserved "set_unified_account";

  oneof metadata {
    OrderActionMetadata order = 1;
    CancelActionMetadata cancel = 2;
    ModifyActionMetadata modify = 3;
    TWAPActionMetadata twap = 4;
    CancelTWAPActionMetadata cancel_twap = 5;
    LeverageActionMetadata leverage = 6;
    MarginActionMetadata margin = 7;
    ScaleActionMetadata scale = 8;
    CancelOrdersActionMetadata cancel_orders = 9;
    ConvertToUsdcActionMetadata convert_to_usdc = 10;
  }
}

// ----------------------------------------------------------------------------
// CreateAction - starts an action workflow session
// ----------------------------------------------------------------------------

message CreateActionRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  ActionParams params = 2 [(buf.validate.field).required = true];
}

// ----------------------------------------------------------------------------
// UpdateAction - change parameters of a pending (unconfirmed) action
// ----------------------------------------------------------------------------

message UpdateActionRequest {
  string action_id = 1 [(buf.validate.field).required = true];
  ActionParams params = 2 [(buf.validate.field).required = true];
}

message ActionPayloadResponse {
  string action_id = 1;              // our internal tracking UUID
  string action_type = 2;            // "order", "cancel", "modify", etc.
  string status = 3;                 // "pending" (awaiting signature)
  string action_json = 4;            // raw JSON with key order preserved for msgpack signing
  int32 asset_index = 5;             // resolved index in dex-specific meta universe
  int32 asset_id = 6;                // exchange asset id used in signed actions
}

// ----------------------------------------------------------------------------
// ConfirmAction - submit signed action to Hyperliquid
// ----------------------------------------------------------------------------

message ConfirmActionRequest {
  string action_id = 1 [(buf.validate.field).required = true];
  SignedAction signed_action = 2 [(buf.validate.field).required = true];
}

message ConfirmActionResponse {
  string status = 1;          // "submitted", "filled", "completed", "error"
  int64 hl_oid = 2;           // Hyperliquid order ID (for order/modify actions)
  string error_message = 3;
}

// ----------------------------------------------------------------------------
// CancelAction - cancel a pending or in-flight action
// ----------------------------------------------------------------------------

message CancelActionRequest {
  string action_id = 1 [(buf.validate.field).required = true];
  SignedAction signed_action = 2; // required only for confirmed orders (HL needs signed cancel)
}

message CancelActionResponse {
  string status = 1;
}

// ActionWorkflowInput wraps the initial request with server-side fields
// for use as the Temporal workflow input. Not used in the RPC API directly.
message ActionWorkflowInput {
  string address = 1;
  string action_id = 2;
  string user_id = 3;
  // Set only on continue-as-new, so the new run resumes order tracking.
  ActionTrackingState continued_state = 4;
}

// ActionTrackingState carries order-tracking state across a continue-as-new.
message ActionTrackingState {
  int64 hl_oid = 1;
  // Lower bound (unix millis) for the fills lookup on fill.
  int64 since_ms = 2;
  string dex = 3;
  string coin = 4;
  string side = 5;
  // Unix millis of the first consecutive "unknown" status, or 0 if not unknown.
  int64 unknown_since_ms = 6;
  // Current poll backoff in millis, so backoff is not reset by the new run.
  int64 poll_interval_ms = 7;
}

// ----------------------------------------------------------------------------
// GetAction - retrieve current state of an action
// ----------------------------------------------------------------------------

message GetActionRequest {
  string action_id = 1 [(buf.validate.field).required = true];
}

message ReconcileActionsRequest {
  repeated string action_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
    items: {string: {min_len: 1}}
  }];
}

message ReconcileActionsResponse {
  repeated GetActionResponse actions = 1;
}

message GetActionResponse {
  string action_id = 1;
  string action_type = 2;    // "order", "leverage", "margin", "cancel", etc.
  string state = 3;           // "pending", "submitted", "completed", "filled", "cancelled", "error"
  int64 hl_oid = 4;           // Hyperliquid order ID (if applicable)
  string error_message = 5;   // error details (if state == "error")
  // Authenticated CLI device that created the action; empty otherwise.
  string cli_device_id = 6;
}

message GetOrderStatusesRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  repeated int64 oid = 2;
}

message PerpOrderStatus {
  int64 oid = 1;
  string status = 2;          // "open", "filled", "canceled", "triggered", "rejected", "marginCanceled", "unknownOid"
  int64 status_timestamp = 3;
  PerpOrder order = 4;
}

message GetOrderStatusesResponse {
  repeated PerpOrderStatus statuses = 1;
}

message GetActiveTwapsRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];

  // Bypass the server-side cache and fetch fresh from Hyperliquid. The cache
  // is refreshed automatically when TWAP actions tracked by Oku finish; use
  // this for explicit user-triggered refreshes.
  bool skip_cache = 2;
}

message GetActiveTwapsResponse {
  repeated PerpTwap twaps = 1;
}

message GetTwapHistoryRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];

  bool skip_cache = 2;
}

message GetTwapHistoryResponse {
  repeated PerpTwap twaps = 1;
}

// PerpTwapSliceFill is a fill produced by one slice order of a TWAP.
message PerpTwapSliceFill {
  PerpTrade fill = 1;
  int64 twap_id = 2;
}

message GetTwapSliceFillsRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];

  // Bypass the server-side cache and fetch fresh from Hyperliquid.
  bool skip_cache = 2;

  // When set, only fills belonging to this TWAP are returned.
  optional int64 twap_id = 3;
}

message GetTwapSliceFillsResponse {
  // Newest first.
  repeated PerpTwapSliceFill fills = 1;
}

// ----------------------------------------------------------------------------
// ValidateAgentKey - check if an agent wallet is approved on Hyperliquid
// ----------------------------------------------------------------------------

message ValidateAgentKeyRequest {
  string agent_address = 1 [(buf.validate.field).required = true];
  string user_address = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
}

message ValidateAgentKeyResponse {
  bool valid = 1;
  // status is derived from Hyperliquid userRole:
  // "approved", "missing", "wrong_user", "not_agent", or "unknown".
  string status = 2;
  string approved_user = 3;
  string role = 4;
}

// ----------------------------------------------------------------------------
// ApproveAgent - approve an agent wallet on Hyperliquid
// ----------------------------------------------------------------------------

message CreateApproveAgentPayloadRequest {
  string agent_address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  // user_address is the Hyperliquid master account that will sign the approveAgent payload.
  string user_address = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
}

message CreateApproveAgentPayloadResponse {
  int64 nonce = 1;
  string typed_data_json = 2; // EIP-712 typed data to pass to signTypedData
  // agent_name must be passed back unchanged to ApproveAgent with the signature.
  // Empty means the flow fell back to Hyperliquid's unnamed agent slot.
  string agent_name = 3;
}

message ApproveAgentRequest {
  string agent_address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  int64 nonce = 2 [(buf.validate.field).int64.gt = 0];
  EVMSignature signature = 3 [(buf.validate.field).required = true];
  // agent_name must match the value in CreateApproveAgentPayloadResponse and
  // the signed typed data. Empty is used when all named slots are occupied by
  // non-Oku agents and the flow falls back to Hyperliquid's unnamed agent slot.
  string agent_name = 4 [(buf.validate.field).string.max_len = 16];
}

message ApproveAgentResponse {
  string status = 1;
  string agent_address = 2;
}

// ----------------------------------------------------------------------------
// ApproveBuilderFee - approve Oku's builder fee on Hyperliquid
// ----------------------------------------------------------------------------

message GetBuilderFeeApprovalPayloadRequest {}

message GetBuilderFeeApprovalPayloadResponse {
  string typed_data_json = 1; // EIP-712 typed data to pass to signTypedData
  int64 nonce = 2;
  string builder_address = 3;
  int32 fee_ppm = 4;
}

message ApproveBuilderFeeRequest {
  int64 nonce = 1 [(buf.validate.field).int64.gt = 0];
  EVMSignature signature = 2 [(buf.validate.field).required = true];
  string builder_address = 3 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  int32 fee_ppm = 4 [(buf.validate.field).int32.gt = 0]; // approval cap in parts per million; must match Oku's configured max
}

message ApproveBuilderFeeResponse {
  string status = 1;
  string builder_address = 2;
  int32 fee_ppm = 3;
}

// ----------------------------------------------------------------------------
// Account abstraction - select the Hyperliquid account mode
// ----------------------------------------------------------------------------

enum PerpsAccountMode {
  PERPS_ACCOUNT_MODE_UNSPECIFIED = 0;
  PERPS_ACCOUNT_MODE_STANDARD = 1;
  PERPS_ACCOUNT_MODE_UNIFIED = 2;
  PERPS_ACCOUNT_MODE_PORTFOLIO_MARGIN = 3;
}

message CreateSetAccountAbstractionPayloadRequest {
  string user_address = 1 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  PerpsAccountMode mode = 2 [(buf.validate.field).required = true, (buf.validate.field).enum.defined_only = true];
}

message CreateSetAccountAbstractionPayloadResponse {
  int64 nonce = 1;
  string typed_data_json = 2; // EIP-712 typed data for the user's main wallet
}

message SetAccountAbstractionRequest {
  int64 nonce = 1 [(buf.validate.field).int64.gt = 0];
  EVMSignature signature = 2 [(buf.validate.field).required = true];
  string user_address = 3 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  PerpsAccountMode mode = 4 [(buf.validate.field).required = true, (buf.validate.field).enum.defined_only = true];
}

message SetAccountAbstractionResponse {
  string status = 1;
  PerpsAccountMode mode = 2;
}

// ----------------------------------------------------------------------------
// Balance transfer - move USDC between Standard spot and perps balances
// ----------------------------------------------------------------------------

enum PerpsBalanceClass {
  PERPS_BALANCE_CLASS_UNSPECIFIED = 0;
  PERPS_BALANCE_CLASS_SPOT = 1;
  PERPS_BALANCE_CLASS_PERPS = 2;
}

message CreateBalanceTransferPayloadRequest {
  string amount = 1 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  PerpsBalanceClass source = 2 [(buf.validate.field).required = true, (buf.validate.field).enum.defined_only = true];
  PerpsBalanceClass destination = 3 [(buf.validate.field).required = true, (buf.validate.field).enum.defined_only = true];
  string perps_dex = 4; // empty for default perps, or a HIP-3 DEX name such as "xyz"
  string user_address = 5 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true]; // required for HIP-3 transfers
}

message CreateBalanceTransferPayloadResponse {
  int64 nonce = 1;
  string typed_data_json = 2;
}

message TransferBalanceRequest {
  string amount = 1 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  PerpsBalanceClass source = 2 [(buf.validate.field).required = true, (buf.validate.field).enum.defined_only = true];
  PerpsBalanceClass destination = 3 [(buf.validate.field).required = true, (buf.validate.field).enum.defined_only = true];
  int64 nonce = 4 [(buf.validate.field).int64.gt = 0];
  EVMSignature signature = 5 [(buf.validate.field).required = true];
  string perps_dex = 6; // empty for default perps, or a HIP-3 DEX name such as "xyz"
  string user_address = 7 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true]; // required for HIP-3 transfers
}

message TransferBalanceResponse {
  string status = 1;
}

// ----------------------------------------------------------------------------
// Withdraw - withdraw USDC margin from Hyperliquid to an Arbitrum wallet
// ----------------------------------------------------------------------------

message CreateWithdrawPayloadRequest {
  string destination = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  string amount = 2 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
}

message CreateWithdrawPayloadResponse {
  int64 time = 1;
  string typed_data_json = 2; // EIP-712 typed data to pass to signTypedData
}

message WithdrawRequest {
  string destination = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  string amount = 2 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  int64 time = 3 [(buf.validate.field).int64.gt = 0];
  EVMSignature signature = 4 [(buf.validate.field).required = true];
}

message WithdrawResponse {
  string status = 1;
  string destination = 2;
  string amount = 3;
}

// ---- Action Metadata Variants ----

// OrderActionMetadata is metadata for placing an order.
message OrderActionMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  string side = 2 [(buf.validate.field).required = true];        // "buy" or "sell"
  string order_type = 3 [(buf.validate.field).required = true];  // "limit", "market", "stop_market", "stop_limit", "take_market", "take_limit"
  string sz = 4 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string limit_px = 6 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string trigger_px = 7 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string tif = 8;             // "GTC", "IOC", "ALO"
  bool reduce_only = 9;
  int32 slippage_bps = 10;   // slippage tolerance in basis points, e.g. 100 = 1%, 50 = 0.5%

  // TP/SL configuration (optional, creates grouped orders)
  string take_profit_px = 11 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string stop_loss_px = 12 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string tp_limit_px = 13 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string sl_limit_px = 14 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string tp_sz = 15 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string sl_sz = 16 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string cloid = 17;          // client order ID (optional, 128-bit hex string)
  int32 leverage = 18 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  bool close_position = 19;   // trigger order types only: HL grouping "positionTpsl", sz sent as "0"
}

// ConvertToUsdcActionMetadata sells a HyperCore token balance into spot USDC.
// The backend resolves the TOKEN/USDC spot pair and builds an IOC sell order.
message ConvertToUsdcActionMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  string sz = 2 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  int32 slippage_bps = 3; // slippage tolerance in basis points, e.g. 100 = 1%
}

// CancelActionMetadata is metadata for cancelling an order.
message CancelActionMetadata {
  string action_id = 1;       // our internal action UUID of the order being cancelled (optional)
  string coin = 2;
  int64 oid = 3;              // HL order ID to cancel
}

message CancelOrderItem {
  string coin = 1;
  int64 oid = 2;
}

// CancelOrdersActionMetadata is metadata for cancelling multiple open orders in
// a single Hyperliquid cancel action.
message CancelOrdersActionMetadata {
  repeated CancelOrderItem orders = 1;
}

// TriggerOrderType distinguishes take-profit from stop-loss in trigger order metadata.
enum TriggerOrderType {
  TRIGGER_ORDER_TYPE_UNSPECIFIED = 0;
  TRIGGER_ORDER_TYPE_TAKE_PROFIT = 1;
  TRIGGER_ORDER_TYPE_STOP_LOSS = 2;
}

// ModifyActionMetadata is metadata for modifying existing orders via Hyperliquid
// batchModify. Each item is a complete replacement order — Hyperliquid performs a
// server-side cancel-and-replace, so every field of the replacement OrderSpec must
// be provided.
message ModifyActionMetadata {
  repeated ModifyOrderMetadata modifies = 1 [(buf.validate.field).repeated.min_items = 1];
}

// ModifyOrderMetadata describes a single order replacement within a batchModify.
message ModifyOrderMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  int64 oid = 2 [(buf.validate.field).int64.gt = 0];  // HL order ID to replace
  string size = 3 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string limit_px = 4 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  // Set for a TP/SL (trigger) modify; leave empty to reprice a plain limit order.
  string trigger_px = 5 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  // Required only when trigger_px is set.
  TriggerOrderType tpsl = 6 [(buf.validate.field).enum.defined_only = true];
  bool is_buy = 7;
  bool is_market = 8;
  optional string cloid = 9;
  // Plain-limit reprice only (trigger_px empty): "GTC", "IOC", or "ALO". Defaults to GTC.
  string tif = 10 [(buf.validate.field).string = {in: ["", "GTC", "IOC", "ALO"]}];
  // Plain-limit reprice only (trigger_px empty). Trigger modifies are always reduce-only.
  bool reduce_only = 11;
}

// TWAPActionMetadata is metadata for placing a TWAP order.
// Builds a Hyperliquid twapOrder action. Fields: coin is the market symbol,
// side is "buy" or "sell", sz is base-asset size, duration_minutes is the
// total TWAP duration, randomize enables randomized slicing, and reduce_only
// ensures the TWAP only reduces an existing position.
message TWAPActionMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  string side = 2 [(buf.validate.field).required = true];
  string sz = 3 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  int32 duration_minutes = 4;
  bool randomize = 5;
  bool reduce_only = 6;

  string trigger_px = 7 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  bool trigger_activate_above = 8;
  string stop_px = 9 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
}

// ScaleActionMetadata is metadata for placing a scale order. Scale orders are
// expanded into multiple Hyperliquid limit child orders in a single order
// action. size_skew is final_child_size / first_child_size; 1 means equal size.
message ScaleActionMetadata {
  string coin = 1 [(buf.validate.field).required = true];
  string side = 2 [(buf.validate.field).required = true];
  string sz = 3 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string start_px = 5 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string end_px = 6 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  int32 total_orders = 7;
  string size_skew = 8 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string tif = 9;             // "GTC", "IOC", "ALO"
  bool reduce_only = 10;
}

// CancelTWAPActionMetadata is metadata for cancelling a TWAP order.
message CancelTWAPActionMetadata {
  string coin = 1;
  int64 twap_id = 2;
}

// LeverageActionMetadata is metadata for updating leverage.
message LeverageActionMetadata {
  string coin = 1;
  int32 leverage = 2;
  bool is_cross = 3;
}

// MarginActionMetadata is metadata for updating isolated margin.
message MarginActionMetadata {
  string coin = 1;
  string amount = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v2.signed_decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_signed_decimal_string) = true];          // amount to add/remove (negative to remove)
}

