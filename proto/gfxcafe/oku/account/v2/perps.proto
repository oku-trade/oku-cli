// Deposit Request/Response
// ============================================================================





// ----------------------------------------------------------------------------
// GetTradeEstimate
// ----------------------------------------------------------------------------

message GetTradeEstimateRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  string coin = 2 [(buf.validate.field).required = true];
  bool is_buy = 3;
  string sz = 4 [(buf.validate.field).required = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  string execution_px = 5 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true, (buf.validate.field).string.(gfxcafe.oku.account.v2.canonical_decimal_string) = true];
  uint32 leverage = 6 [(buf.validate.field).uint32 = {gte: 1, lte: 1000}];
  bool post_only = 7; // estimate as a maker/post-only order; defaults to taker fees
  // Margin mode of the order. Optional: when unset the estimate is computed as cross,
  // matching pre-existing clients.
  optional bool is_cross = 8;
}

message GetTradeEstimateResponse {
  string estimated_fill_px = 1;     // estimated execution price from orderbook
  string estimated_slippage_pct = 2; // estimated slippage from mid price
  string margin_required = 3;       // margin needed at current leverage
  string fee_estimate = 4 [deprecated = true];          // Deprecated: use GetUserFeeRates; estimated trading fee in USDC
  string builder_fee_estimate = 5 [deprecated = true];  // Deprecated: use GetUserFeeRates; estimated builder fee in USDC
  string max_trade_sz = 6;          // maximum position size given current margin
  string mark_px = 7;               // current mark price
  string mid_px = 8;                // current mid price
  uint32 leverage = 9;              // current leverage setting
  string available_margin = 10;     // available margin for new positions
  string estimated_liquidation_px = 11; // projected liquidation price, empty if not available
  string total_fee_estimate = 12 [deprecated = true];    // Deprecated: use GetUserFeeRates; fee_estimate + builder_fee_estimate in USDC
}

// ----------------------------------------------------------------------------
// GetUserFeeRates
// ----------------------------------------------------------------------------

message GetUserFeeRatesRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  string coin = 2 [(buf.validate.field).required = true];
}

message GetUserFeeRatesResponse {
  string maker_protocol_fee_rate = 1; // effective protocol rate as a decimal fraction; 0.000144 = 0.0144%
  string taker_protocol_fee_rate = 2; // effective protocol rate as a decimal fraction; 0.000432 = 0.0432%
  string builder_fee_rate = 3;         // Oku builder rate as a decimal fraction
}

// ----------------------------------------------------------------------------
// GetUserFeeSchedule
// ----------------------------------------------------------------------------
// Field names deliberately mirror Hyperliquid's native {"type":"userFees"}
// payload (feeSchedule.tiers.vip, dailyUserVlm, ...) so clients can validate it
// with the same schema as the native info endpoint. Every number is a decimal
// string and every rate a decimal fraction (0.00045 = 0.045%).

message GetUserFeeScheduleRequest {
  // Master or sub-account address. An agent (API) wallet is resolved to its
  // master account server-side.
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
}

message GetUserFeeScheduleResponse {
  PerpFeeSchedule fee_schedule = 1;
  string user_cross_rate = 2;       // effective perp taker rate, VIP, referral and staking discounts applied
  string user_add_rate = 3;         // effective perp maker rate, VIP, referral and staking discounts applied
  string user_spot_cross_rate = 4;  // effective spot taker rate
  string user_spot_add_rate = 5;    // effective spot maker rate
  string active_referral_discount = 6;
  optional PerpStakingDiscountTier active_staking_discount = 7; // unset when the user has no staking discount
  // Most recent UTC days, oldest first: the 14 completed days that score the
  // VIP tier plus today's in-progress bucket.
  repeated PerpDailyUserVolume daily_user_vlm = 8;
}

message PerpFeeSchedule {
  string cross = 1;       // base perp taker rate
  string add = 2;         // base perp maker rate
  string spot_cross = 3;  // base spot taker rate
  string spot_add = 4;    // base spot maker rate
  PerpFeeTiers tiers = 5;
  string referral_discount = 6;
  repeated PerpStakingDiscountTier staking_discount_tiers = 7;
}

message PerpFeeTiers {
  repeated PerpVipFeeTier vip = 1; // VIP tiers 1..N; tier 0 is PerpFeeSchedule.cross/add
  repeated PerpMmFeeTier mm = 2;
}

message PerpVipFeeTier {
  string ntl_cutoff = 1;  // rolling notional volume in USDC required for the tier
  string cross = 2;       // taker rate
  string add = 3;         // maker rate
  string spot_cross = 4;
  string spot_add = 5;
}

message PerpMmFeeTier {
  string maker_fraction_cutoff = 1;
  string add = 2; // maker rate, negative for a rebate
}

message PerpStakingDiscountTier {
  string bps_of_max_supply = 1;
  string discount = 2;
}

message PerpDailyUserVolume {
  string date = 1; // UTC day as YYYY-M-D (Hyperliquid does not zero-pad)
  string user_cross = 2;
  string user_add = 3;
  string exchange = 4;
}

// ----------------------------------------------------------------------------
// GetActiveAssetData
// ----------------------------------------------------------------------------

message GetActiveAssetDataRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true]; // Account wallet not agent wallet
  string coin = 2 [(buf.validate.field).required = true];
}

message GetActiveAssetDataResponse {
  PerpActiveAssetData active_asset_data = 1;
}

// ============================================================================
// Deposit Tokens + Transaction Building
// ============================================================================

// ----------------------------------------------------------------------------
// GetDepositTokens
// ----------------------------------------------------------------------------

message GetDepositTokensRequest {}

message DepositToken {
  string symbol = 1;
  string address = 2;              // token contract address on the source chain
  int64 chain_id = 3;              // source chain (e.g., 42161 for Arbitrum)
  string chain = 4;                // CAIP-2 chain identifier, e.g. "eip155:42161"
  int32 decimals = 5;
  string min_deposit = 6;          // minimum deposit amount
}

message GetDepositTokensResponse {
  repeated DepositToken tokens = 1;
}

// ----------------------------------------------------------------------------
// BuildDepositTransaction
// ----------------------------------------------------------------------------

message BuildDepositTransactionRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  string amount = 2 [(buf.validate.field).required = true]; // human-readable amount (e.g., "100.0")
  string token_symbol = 3;         // defaults to "USDC" if not specified
}

message BuildDepositTransactionResponse {
  // ERC-20 approve transaction (if needed)
  DepositTransaction approve_tx = 1;
  // Bridge deposit transaction
  DepositTransaction deposit_tx = 2;
  // Whether approval is needed (false if already approved for sufficient amount)
  bool needs_approval = 3;
  // Effective amount being deposited (after any conversions)
  string amount = 4;
  string token_symbol = 5;
}

message DepositTransaction {
  string to = 1;                   // contract address
  string data = 2;                 // encoded calldata (hex)
  string value = 3;                // ETH value (usually "0")
  int64 chain_id = 4;              // chain to submit on
  string chain = 5;                // CAIP-2 chain identifier
}

// ----------------------------------------------------------------------------
// GenerateDepositAddress (via HyperUnit)
// ----------------------------------------------------------------------------

message GenerateDepositAddressRequest {
  string hl_address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  string asset = 2 [(buf.validate.field).required = true];       // asset symbol: "btc", "eth", "sol", "avax", etc.
  string source_chain = 3 [(buf.validate.field).string.(gfxcafe.oku.account.v2.caip2) = true]; // CAIP-2: "bip122:000000000019d6689c085ae165831e93" (bitcoin), "eip155:1" (ethereum), "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp", etc.
}

message GenerateDepositAddressResponse {
  string deposit_address = 1;      // address on the source chain to send assets to
  string asset = 2;                // asset symbol
  string source_chain = 3;         // CAIP-2 chain identifier (echo back)
  string min_deposit = 4;          // minimum deposit amount for this asset
  string hl_address = 5;           // the HL address this deposit address is tied to
}

// ----------------------------------------------------------------------------
// GetDepositOperations (via HyperUnit)
// ----------------------------------------------------------------------------

message GetDepositOperationsRequest {
  // Hyperliquid destination address or generated HyperUnit protocol/deposit address.
  string address = 1 [(buf.validate.field).required = true];
}

message HyperUnitDepositAddress {
  string source_coin_type = 1;
  string destination_chain = 2;
  string address = 3;
}

message HyperUnitOperation {
  string operation_id = 1;
  string op_created_at = 2;
  string protocol_address = 3;
  string source_address = 4;
  string destination_address = 5;
  string source_chain = 6;
  string destination_chain = 7;
  string source_amount = 8;
  string destination_fee_amount = 9;
  string sweep_fee_amount = 10;
  string state = 11;
  string source_tx_hash = 12;
  string destination_tx_hash = 13;
  int64 source_tx_confirmations = 14;
  int64 destination_tx_confirmations = 15;
  string asset = 16;
  string state_started_at = 17;
  string state_updated_at = 18;
  string state_next_attempt_at = 19;
  string broadcast_at = 20;
  int64 position_in_withdraw_queue = 21;
}

message GetDepositOperationsResponse {
  repeated HyperUnitDepositAddress addresses = 1;
  repeated HyperUnitOperation operations = 2;
}

// ============================================================================
// Share Cards
// ============================================================================

message GeneratePnlCardRequest {
  // Background variant: 1 = driving, 2 = flying, 3 = astronaut.
  int32 background = 1 [(buf.validate.field).int32 = {gte: 1, lte: 3}];
  // Hyperliquid account/subaccount that owns the order.
  string address = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
  // Closing Hyperliquid order ID. Card values are derived server-side from its fills.
  int64 oid = 3 [(buf.validate.field).int64.gt = 0];
  // Leverage multiplier rendered in the position badge (e.g. 3 renders "3x Long").
  // Optional; omit or send 0 to render the badge without a multiplier. Fills carry
  // no leverage, so this is client-supplied and not verified server-side.
  uint32 leverage = 4 [(buf.validate.field).uint32.lte = 1000];
  // Whether the server-rendered ROI is visible. Defaults to visible when omitted.
  optional bool show_roi = 5;
  // Whether the server-rendered USD PnL is visible. Defaults to visible when omitted.
  optional bool show_pnl = 6;
  // Whether the server-rendered entry price is visible. Defaults to visible when omitted.
  optional bool show_entry_price = 7;
  // Whether the server-rendered close price is visible. Defaults to visible when omitted.
  optional bool show_close_price = 8;
  // Whether the server-rendered position duration is visible. Defaults to hidden when omitted.
  optional bool show_time_open = 9;
}

message GeneratePnlCardResponse {
  // Public CDN URL of the rendered PNG.
  string url = 1;
}
