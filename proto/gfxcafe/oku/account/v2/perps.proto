syntax = "proto3";

package gfxcafe.oku.account.v2;

import "buf/validate/validate.proto";
import "gfxcafe/oku/account/v1/validate.proto";
import "gfxcafe/oku/account/v2/validate.proto";

option go_package = "gfx.cafe/oku/account/gen/go/gfxcafe/oku/account/v2;accountv2";

// ============================================================================
// Service Definition
// ============================================================================

// PerpsService provides perpetual futures trading operations powered by Hyperliquid.
service PerpsService {
  // ---- Market Data (no auth required) ----

  // GetMarkets returns all available perpetual markets with metadata and live stats.
  // Pass optional coin filter to get a single market.
  rpc GetMarkets(GetMarketsRequest) returns (GetMarketsResponse);

  // GetSpotMarkets returns all available spot markets with metadata and live stats.
  // Pass optional coin filter to get a single market.
  rpc GetSpotMarkets(GetSpotMarketsRequest) returns (GetSpotMarketsResponse);

  // GetMarketPrice returns current prices for a single perp market. Served from
  // a short-lived server-side cache shared across all users, so it is safe to
  // poll frequently. Use this instead of GetMarkets when only prices are needed.
  rpc GetMarketPrice(GetMarketPriceRequest) returns (GetMarketPriceResponse);

  // GetOrderbook returns an L2 orderbook snapshot for a market.
  rpc GetOrderbook(GetOrderbookRequest) returns (GetOrderbookResponse);

  // GetOrderbookAggregationOptions returns asset-aware display steps and the
  // native Hyperliquid parameters needed to subscribe at each depth.
  rpc GetOrderbookAggregationOptions(GetOrderbookAggregationOptionsRequest) returns (GetOrderbookAggregationOptionsResponse);

  // GetCandles returns OHLCV candlestick data for a market.
  rpc GetCandles(GetCandlesRequest) returns (GetCandlesResponse);

  // GetMarketFundingHistory returns the market-wide funding rate history.
  rpc GetMarketFundingHistory(GetMarketFundingHistoryRequest) returns (GetMarketFundingHistoryResponse);

  // ---- Streaming (no auth for market data) ----

  // StreamOrderbook streams live orderbook updates for a market.
  rpc StreamOrderbook(StreamOrderbookRequest) returns (stream OrderbookUpdate);

  // StreamCandles streams live candlestick updates for a market.
  rpc StreamCandles(StreamCandlesRequest) returns (stream CandleUpdate);

  // StreamTrades streams recent and live public trades for a market.
  rpc StreamTrades(StreamTradesRequest) returns (stream TradeUpdate);

  // StreamAssetContext streams live market context for a perpetual asset.
  rpc StreamAssetContext(StreamAssetContextRequest) returns (stream AssetContextUpdate);

  // ---- Account (no auth, address-based reads) ----

  // GetAccountState returns a user's full account state: balance, margin summary,
  // positions, open orders, and builder fee approval status.
  //
  // Deprecated: this fans out to 7 Hyperliquid info requests (~86 rate-limit
  // weight) per call. Prefer the split endpoints so each data group can be
  // polled at its own cadence: GetPerpPositions (fast, cheap), GetOpenOrders,
  // GetAccountBalances (slow), and GetBuilderFeeStatus (once per session).
  rpc GetAccountState(GetAccountStateRequest) returns (GetAccountStateResponse);

  // GetPerpPositions returns perp positions and margin summaries aggregated
  // across all supported Hyperliquid perp interfaces. Cheap on Hyperliquid rate
  // limits (weight 2 per interface) -- safe to poll frequently.
  rpc GetPerpPositions(GetPerpPositionsRequest) returns (GetPerpPositionsResponse);

  // GetOpenOrders returns open orders across all supported Hyperliquid perp
  // interfaces. Heavier than GetPerpPositions (weight 20 per interface); poll
  // at a slower cadence and invalidate on order actions/fills.
  rpc GetOpenOrders(GetOpenOrdersRequest) returns (GetOpenOrdersResponse);

  // GetAccountBalances returns spot and separate Standard-mode perps balances.
  // This may fan out across supported HIP-3 DEXs; poll slowly and invalidate
  // after deposits, withdrawals, transfers, and spot conversions.
  rpc GetAccountBalances(GetAccountBalancesRequest) returns (GetAccountBalancesResponse);

  // GetAccountMode returns Hyperliquid's raw account abstraction mode.
  rpc GetAccountMode(GetAccountModeRequest) returns (GetAccountModeResponse);

  // GetBuilderFeeStatus returns the user's builder fee approval status and
  // Oku's builder fee configuration. Approval flips at most once per account --
  // fetch once per session and invalidate after ApproveBuilderFee.
  rpc GetBuilderFeeStatus(GetBuilderFeeStatusRequest) returns (GetBuilderFeeStatusResponse);

  // GetActiveAssetData returns user-scoped active asset data for a coin.
  rpc GetActiveAssetData(GetActiveAssetDataRequest) returns (GetActiveAssetDataResponse);

  // GetPerpsPnlSummary returns Hyperliquid's cumulative perps-only PnL
  // (realized + unrealized, net of deposits and withdrawals) per window, taken
  // from the portfolio info request. Weight 20 on Hyperliquid rate limits and
  // served from a short-lived cache -- poll slowly.
  rpc GetPerpsPnlSummary(GetPerpsPnlSummaryRequest) returns (GetPerpsPnlSummaryResponse);

  // ---- Trading (auth required) ----
  // Flow: CreateAction -> (optionally UpdateAction to change params) -> ConfirmAction with signature.
  // Each action is a Temporal workflow session. The workflow builds the HL action payload,
  // allows parameter iteration, then submits to HL on confirmation and tracks completion.

  // CreateAction starts an action workflow session and builds the HL action payload.
  // The action is NOT submitted to HL yet -- call ConfirmAction with the signed payload.
  rpc CreateAction(CreateActionRequest) returns (ActionPayloadResponse);

  // UpdateAction changes the parameters of a pending (unconfirmed) action.
  // Returns an updated HL action payload for the client to sign.
  rpc UpdateAction(UpdateActionRequest) returns (ActionPayloadResponse);

  // ConfirmAction submits the signed action to Hyperliquid.
  // The workflow then tracks the action's lifecycle (fills, cancellation, etc.).
  rpc ConfirmAction(ConfirmActionRequest) returns (ConfirmActionResponse);

  // CancelAction cancels a pending or in-flight action.
  // For unconfirmed actions, just abandons the workflow.
  // For confirmed orders, submits a signed cancel to HL.
  rpc CancelAction(CancelActionRequest) returns (CancelActionResponse);

  // GetAction returns the current state of an action by its ID.
  // Used by the frontend to poll for action completion after ConfirmAction.
  rpc GetAction(GetActionRequest) returns (GetActionResponse);

  // ReconcileActions refreshes submitted actions from Hyperliquid and persists
  // any terminal statuses/fills. Use this when reconnecting or explicitly
  // refreshing long-lived resting orders.
  rpc ReconcileActions(ReconcileActionsRequest) returns (ReconcileActionsResponse);

  // GetOrderStatuses returns the current Hyperliquid status for multiple order IDs.
  // Used by the frontend to track submitted resting orders without fetching all open orders.
  rpc GetOrderStatuses(GetOrderStatusesRequest) returns (GetOrderStatusesResponse);

  // GetActiveTwaps returns currently active Hyperliquid TWAP orders for a user.
  rpc GetActiveTwaps(GetActiveTwapsRequest) returns (GetActiveTwapsResponse);

  // GetTwapHistory returns a user's TWAP lifecycle entries across all states (active and terminal), newest first.
  rpc GetTwapHistory(GetTwapHistoryRequest) returns (GetTwapHistoryResponse);

  // GetTwapSliceFills returns the fills produced by a user's TWAP slice orders,
  // each linked to its parent TWAP by twap_id.
  rpc GetTwapSliceFills(GetTwapSliceFillsRequest) returns (GetTwapSliceFillsResponse);

  // ValidateAgentKey checks whether an agent wallet is approved on Hyperliquid
  // for the authenticated user.
  rpc ValidateAgentKey(ValidateAgentKeyRequest) returns (ValidateAgentKeyResponse);

  // GetBuilderFeeApprovalPayload returns the typed data clients must sign to
  // approve Oku's configured builder fee on Hyperliquid.
  rpc GetBuilderFeeApprovalPayload(GetBuilderFeeApprovalPayloadRequest) returns (GetBuilderFeeApprovalPayloadResponse);

  // CreateApproveAgentPayload returns the EIP-712 payload the client must sign
  // before calling ApproveAgent. The payload includes a fresh Oku-generated
  // named agent wallet label so approvals do not use Hyperliquid's unnamed slot.
  rpc CreateApproveAgentPayload(CreateApproveAgentPayloadRequest) returns (CreateApproveAgentPayloadResponse);

  // ApproveAgent relays a signed Hyperliquid approveAgent action through the
  // backend so clients never call Hyperliquid directly.
  rpc ApproveAgent(ApproveAgentRequest) returns (ApproveAgentResponse);

  // ApproveBuilderFee relays a signed Hyperliquid approveBuilderFee action.
  // This grants Oku permission to include builder fees on future orders.
  rpc ApproveBuilderFee(ApproveBuilderFeeRequest) returns (ApproveBuilderFeeResponse);

  // CreateSetAccountAbstractionPayload returns the typed data the user's main
  // wallet must sign before changing Hyperliquid account mode.
  rpc CreateSetAccountAbstractionPayload(CreateSetAccountAbstractionPayloadRequest) returns (CreateSetAccountAbstractionPayloadResponse);

  // SetAccountAbstraction relays the signed userSetAbstraction action.
  rpc SetAccountAbstraction(SetAccountAbstractionRequest) returns (SetAccountAbstractionResponse);

  // CreateBalanceTransferPayload returns typed data for moving collateral
  // between spot and default or supported HIP-3 perps balances.
  rpc CreateBalanceTransferPayload(CreateBalanceTransferPayloadRequest) returns (CreateBalanceTransferPayloadResponse);

  // TransferBalance relays a signed usdClassTransfer or sendAsset action.
  rpc TransferBalance(TransferBalanceRequest) returns (TransferBalanceResponse);

  // CreateWithdrawPayload returns the EIP-712 payload the client must sign
  // before calling Withdraw. Withdrawals require the user's wallet signature;
  // approved agents cannot withdraw funds.
  rpc CreateWithdrawPayload(CreateWithdrawPayloadRequest) returns (CreateWithdrawPayloadResponse);

  // Withdraw relays a signed Hyperliquid withdraw3 action through the backend.
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);

  // ---- Trade Info ----

  // GetTradeEstimate previews a trade: estimated fill price, margin required, max size.
  rpc GetTradeEstimate(GetTradeEstimateRequest) returns (GetTradeEstimateResponse);

  // GetUserFeeRates returns effective protocol and builder fee rates for a user and market.
  rpc GetUserFeeRates(GetUserFeeRatesRequest) returns (GetUserFeeRatesResponse);

  // GetUserFeeSchedule returns Hyperliquid's fee schedule (base rates, VIP and
  // market-maker tiers, discount tables) plus the user's effective rates. The
  // JSON shape mirrors Hyperliquid's native {"type":"userFees"} response.
  rpc GetUserFeeSchedule(GetUserFeeScheduleRequest) returns (GetUserFeeScheduleResponse);

  // ---- History (auth required) ----

  // GetTradeHistory returns the user's persisted trade/fill history.
  rpc GetTradeHistory(GetTradeHistoryRequest) returns (GetTradeHistoryResponse);

  // GetUserFills returns the user's most recent fills live from Hyperliquid (userFills), newest first.
  rpc GetUserFills(GetUserFillsRequest) returns (GetUserFillsResponse);

  // GetFundingHistory returns the user's funding payment history.
  rpc GetFundingHistory(GetFundingHistoryRequest) returns (GetFundingHistoryResponse);

  // GetOrderHistory returns the user's historical orders.
  rpc GetOrderHistory(GetOrderHistoryRequest) returns (GetOrderHistoryResponse);

  // GetDepositWithdrawHistory returns the user's USDC deposits and withdrawals.
  rpc GetDepositWithdrawHistory(GetDepositWithdrawHistoryRequest) returns (GetDepositWithdrawHistoryResponse);

  // GetHyperliquidOrderInfo returns fill-derived entry, close, size, PnL, fees,
  // and return data for a closing Hyperliquid order. Requires authentication.
  rpc GetHyperliquidOrderInfo(GetHyperliquidOrderInfoRequest) returns (GetHyperliquidOrderInfoResponse);

  // ---- Share Cards ----

  // GeneratePnlCard renders a shareable PnL card image server-side, uploads it
  // to CDN storage, and returns the public URL. Requires authentication; rate
  // limited.
  rpc GeneratePnlCard(GeneratePnlCardRequest) returns (GeneratePnlCardResponse);

  // ---- Deposits ----

  // GetDepositTokens returns tokens that can be deposited to Hyperliquid,
  // including bridge contract details, chain info, and minimum amounts.
  rpc GetDepositTokens(GetDepositTokensRequest) returns (GetDepositTokensResponse);

  // BuildDepositTransaction forms the ERC-20 approve and bridge deposit transactions
  // for the native Arbitrum USDC bridge.
  rpc BuildDepositTransaction(BuildDepositTransactionRequest) returns (BuildDepositTransactionResponse);

  // GenerateDepositAddress generates a unique deposit address via HyperUnit
  // for depositing native assets (BTC, ETH, SOL, etc.) to Hyperliquid.
  // The address is permanently tied to the user's HL address.
  rpc GenerateDepositAddress(GenerateDepositAddressRequest) returns (GenerateDepositAddressResponse);

  // GetDepositOperations returns HyperUnit deposit/withdraw operations associated
  // with a Hyperliquid address or generated deposit address.
  rpc GetDepositOperations(GetDepositOperationsRequest) returns (GetDepositOperationsResponse);
}

// ============================================================================
// Core Types
// ============================================================================

// PerpMarket represents a perpetual futures market.
message PerpMarket {
  string coin = 1;
  int32 sz_decimals = 2;
  int32 max_leverage = 3;
  bool only_isolated = 4;
  int32 asset_id = 6;             // exchange asset id used in signed actions

  // Live context (populated when available)
  string mark_px = 10;
  string oracle_px = 11;
  string mid_px = 12;
  string funding = 13;
  string open_interest = 14;
  string prev_day_px = 15;
  string day_ntl_vlm = 16;
  string premium = 17;

  string display_name = 18;       // human-readable name from HL annotations; falls back to coin
  repeated string keywords = 19;

  // mark_px * shares outstanding, USD. Equity markets only; empty when the
  // share count is unknown.
  string implied_market_cap = 20;
}

// PerpPosition represents an open perpetual position.
message PerpPosition {
  string coin = 1;
  string szi = 2;             // signed size (negative = short)
  string entry_px = 3;
  string position_value = 4;
  string unrealized_pnl = 5;
  string return_on_equity = 6;
  string liquidation_px = 7;  // empty if no liquidation price
  string leverage_type = 8;   // "cross" or "isolated"
  int32 leverage_value = 9;
  string margin_used = 10;
  string cum_funding_all_time = 11;
  string cum_funding_since_open = 12;
}

// PerpActiveAssetData represents Hyperliquid activeAssetData for one user/coin.
message PerpActiveAssetData {
  string coin = 1;
  string leverage_type = 2;   // "cross" or "isolated"
  int32 leverage_value = 3;
  string mark_px = 4;
  repeated string available_to_trade = 5; // [buy, sell] notional available to trade
  repeated string max_trade_szs = 6;      // [buy, sell] max base size
}

// PerpOrder represents an open order.
message PerpOrder {
  string coin = 1;
  string limit_px = 2;
  int64 oid = 3;
  string side = 4;            // "B" (buy) or "A" (sell)
  string sz = 5;
  int64 timestamp = 6;
  string orig_sz = 7;
  string cloid = 8;
  string order_type = 9;
  string trigger_px = 10;
  string trigger_condition = 11;
  bool is_trigger = 12;
  bool reduce_only = 13;
  bool is_position_tpsl = 14;     // HL grouping "positionTpsl"; closes whole position, sz is "0"
  int32 asset_id = 15;            // exchange asset id when known
  string tif = 16;                // time-in-force: "Gtc", "Ioc", "Alo"
  repeated PerpOrder children = 17; // nested TP/SL orders attached to this order
  // Server-verified origin. Unset when the order was not placed through an
  // authenticated Oku CLI device (external or unknown).
  OrderOrigin origin = 18;
}

// OrderOrigin is authenticated order attribution, derived only from the
// server-side device credential that created the action, never from client
// headers. It survives device revocation.
message OrderOrigin {
  string cli_device_id = 1;
  string cli_device_name = 2;
}

// PerpTwap represents a Hyperliquid TWAP lifecycle entry.
message PerpTwap {
  int64 twap_id = 1;
  int64 time = 2;              // HL event time, seconds
  string status = 3;
  string coin = 4;
  string user = 5;
  string side = 6;             // "B" (buy) or "A" (sell)
  string sz = 7;
  int32 minutes = 8;
  bool reduce_only = 9;
  bool randomize = 10;
  int64 timestamp = 11;        // TWAP start timestamp, milliseconds
  int32 leverage = 12;
  string executed_sz = 13;
  string executed_ntl = 14;
  string trigger_px = 15;
  bool trigger_activate_above = 16;
  string stop_px = 17;
}

// OrderbookLevel represents a single price level in the orderbook.
message OrderbookLevel {
  string px = 1;
  string sz = 2;
  int32 n = 3;                // number of orders at this level
}

// PerpCandle represents an OHLCV candlestick.
message PerpCandle {
  int64 t = 1;                // open time (milliseconds)
  string o = 2;               // open price
  string h = 3;               // high price
  string l = 4;               // low price
  string c = 5;               // close price
  string v = 6;               // volume (base)
  int32 n = 7;                // number of trades
}

// PerpTrade represents a trade fill.
message PerpTrade {
  string coin = 1;
  string px = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true];
  string sz = 3 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true];
  string side = 4;
  int64 time = 5;
  string dir = 6;             // "Open Long", "Close Long", "Open Short", "Close Short"
  string closed_pnl = 7;
  string hash = 8;
  int64 oid = 9;
  bool crossed = 10;
  string fee = 11;
  int64 tid = 12;
  string fee_token = 13;
  string start_position = 14; // position size before this fill
  string builder_fee = 15;    // builder fee amount (separate from trading fee)
  PerpTradeKind kind = 16;
  PerpLiquidation liquidation = 17;
  int64 twap_id = 18;         // HL TWAP id this fill belongs to; 0 when not a TWAP fill
  // Server-verified origin of the order this fill belongs to; unset when
  // external or unknown.
  OrderOrigin origin = 19;
}

enum PerpTradeKind {
  PERP_TRADE_KIND_UNSPECIFIED = 0;
  PERP_TRADE_KIND_NORMAL = 1;
  PERP_TRADE_KIND_LIQUIDATION = 2;
  PERP_TRADE_KIND_AUTO_DELEVERAGED = 3;
}

message PerpLiquidation {
  string liquidated_user = 1;
  string mark_px = 2;
  string method = 3;
}

// PerpMarketTrade represents a public market trade.
message PerpMarketTrade {
  string coin = 1;
  string px = 2 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true];
  string sz = 3 [(buf.validate.field).string.(gfxcafe.oku.account.v2.decimal_string) = true];
  string side = 4;            // "B" (buy) or "A" (sell)
  int64 time = 5;
  string hash = 6;
  int64 tid = 7;
}

// PerpFundingPayment represents a single funding payment.
message PerpFundingPayment {
  int64 time = 1;
  string coin = 2;
  string usdc = 3;            // funding payment amount
  string szi = 4;             // position size at time
  string funding_rate = 5;
  string hash = 6;            // HL transaction hash for this funding payment
}

message PerpDepositWithdraw {
  int64 time = 1;
  string hash = 2;
  string type = 3;            // "deposit", "withdraw", "spotTransfer"
  string token = 4;
  string amount = 5;
  string usdc_value = 6;
  string fee = 7;
  // HL ledger nonce; for withdrawals it is the signed action time (ms) * 1000.
  int64 nonce = 8;
}

// MarginSummary contains margin/balance information.
message PerpsMarginSummary {
  string account_value = 1;
  string total_ntl_pos = 2;
  string total_raw_usd = 3;
  string total_margin_used = 4;
}

// SignedAction wraps a pre-signed Hyperliquid exchange action.
// The action, nonce, and signature are produced by the user's wallet or approved agent.
message EVMSignature {
  string r = 1 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^0x[0-9a-fA-F]{64}$"];
  string s = 2 [(buf.validate.field).required = true, (buf.validate.field).string.pattern = "^0x[0-9a-fA-F]{64}$"];
  optional uint64 v = 3 [(buf.validate.field).required = true, (buf.validate.field).uint64 = {in: [0, 1, 27, 28]}];
}

message SignedAction {
  string action_json = 1 [(buf.validate.field).required = true]; // raw JSON with key order preserved for msgpack signing
  int64 nonce = 2 [(buf.validate.field).required = true];
  EVMSignature signature = 3 [(buf.validate.field).required = true];
  string vault_address = 4;  // optional, for subaccount trading
}

// ============================================================================
// Market Data Request/Response
// ============================================================================

// ----------------------------------------------------------------------------
// GetMarkets
// ----------------------------------------------------------------------------

message GetMarketsRequest {
  string coin = 1; // optional filter: if set, returns only this market
  string dex = 2;  // optional perp dex; empty means default Hyperliquid perps
}

message GetMarketsResponse {
  repeated PerpMarket markets = 1;
}

// ----------------------------------------------------------------------------
// GetMarketPrice
// ----------------------------------------------------------------------------

message GetMarketPriceRequest {
  string coin = 1 [(buf.validate.field).required = true]; // canonical market id, e.g. "BTC" or "xyz:AAPL"
}

message GetMarketPriceResponse {
  string coin = 1;
  string mark_px = 2;   // Hyperliquid mark price (used for PnL/liquidations)
  string mid_px = 3;    // book mid price; may be empty
  string oracle_px = 4; // oracle price
}

// ----------------------------------------------------------------------------
// GetSpotMarkets
// ----------------------------------------------------------------------------

message GetSpotMarketsRequest {
  string coin = 1; // optional filter: raw Hyperliquid spot coin, e.g. "@107" or "PURR/USDC"
}

message GetSpotMarketsResponse {
  repeated SpotMarket markets = 1;
}

message SpotMarket {
  string coin = 1;          // raw Hyperliquid spot coin, e.g. "@107" or "PURR/USDC"
  string display_coin = 2;  // derived pair name, e.g. "HYPE/USDC"
  int32 index = 3;          // spot pair index; "@107" uses index 107
  int32 asset_id = 4;       // exchange asset id used in signed spot actions: 10000 + index

  string base_token = 5;
  string quote_token = 6;
  int32 base_token_index = 7;
  int32 quote_token_index = 8;
  int32 sz_decimals = 9;
  int32 wei_decimals = 10;
  bool is_canonical = 11;

  // Live context (populated when available)
  string mark_px = 12;
  string mid_px = 13;
  string prev_day_px = 14;
  string day_ntl_vlm = 15;
}

// ----------------------------------------------------------------------------
// GetOrderbook
// ----------------------------------------------------------------------------

message GetOrderbookRequest {
  string coin = 1 [(buf.validate.field).required = true];
  optional int32 n_sig_figs = 2; // aggregation: 2, 3, 4, or 5
  optional int32 mantissa = 3;   // aggregation step: 1, 2, or 5; only valid with n_sig_figs = 5
}

message GetOrderbookResponse {
  string coin = 1;
  repeated OrderbookLevel bids = 2;
  repeated OrderbookLevel asks = 3;
}

message GetOrderbookAggregationOptionsRequest {
  string coin = 1 [(buf.validate.field).required = true];
}

message GetOrderbookAggregationOptionsResponse {
  string coin = 1;
  repeated OrderbookAggregationOption options = 2;
  // Price used to resolve current significant-figure magnitude.
  string reference_price = 3;
  // Options remain valid while price is in [valid_from_price, valid_until_price).
  string valid_from_price = 4;
  string valid_until_price = 5;
}

message OrderbookAggregationOption {
  // Stable native configuration identifier: 5:1, 5:2, 5:5, 4, 3, or 2.
  string id = 1;
  // Exact user-facing price bucket increment.
  string price_step = 2;
  int32 n_sig_figs = 3;
  optional int32 mantissa = 4;
}

// ----------------------------------------------------------------------------
// GetCandles
// ----------------------------------------------------------------------------

message GetCandlesRequest {
  string coin = 1 [(buf.validate.field).required = true];
  string interval = 2 [(buf.validate.field).required = true]; // "1m","5m","15m","1h","4h","1d", etc.
  int64 start_time = 3 [(buf.validate.field).required = true]; // milliseconds
  int64 end_time = 4 [(buf.validate.field).required = true];   // milliseconds
}

message GetCandlesResponse {
  repeated PerpCandle candles = 1;
}

message GetMarketFundingHistoryRequest {
  string coin = 1 [(buf.validate.field).required = true];
  int64 start_time = 2 [(buf.validate.field).required = true];
  int64 end_time = 3;
}

message PerpFundingRate {
  int64 time = 1;
  string funding_rate = 2;
  string premium = 3;
}

message GetMarketFundingHistoryResponse {
  repeated PerpFundingRate rates = 1;
}

// ============================================================================
// Streaming Request/Response
// ============================================================================

// ----------------------------------------------------------------------------
// StreamOrderbook
// ----------------------------------------------------------------------------

message StreamOrderbookRequest {
  string coin = 1 [(buf.validate.field).required = true];
  optional int32 n_sig_figs = 2;
  optional int32 mantissa = 3;
}

message OrderbookUpdate {
  string coin = 1;
  int64 time = 2;
  repeated OrderbookLevel bids = 3;
  repeated OrderbookLevel asks = 4;
}

// ----------------------------------------------------------------------------
// StreamCandles
// ----------------------------------------------------------------------------

message StreamCandlesRequest {
  string coin = 1 [(buf.validate.field).required = true];
  string interval = 2 [(buf.validate.field).required = true];
}

message CandleUpdate {
  PerpCandle candle = 1;
  string coin = 2;
  string interval = 3;
}

// ----------------------------------------------------------------------------
// StreamTrades
// ----------------------------------------------------------------------------

message StreamTradesRequest {
  string coin = 1 [(buf.validate.field).required = true];
  optional int32 limit = 2; // number of retained recent trades to send before live updates
}

message TradeUpdate {
  string coin = 1;
  repeated PerpMarketTrade trades = 2;
}

message StreamAssetContextRequest {
  string coin = 1 [(buf.validate.field).required = true];
}

message AssetContextUpdate {
  string coin = 1;
  string mark_px = 2;               // mark price (used for PnL/liquidations)
  string mid_px = 3;                // book mid price
  string oracle_px = 4;             // oracle price
  string funding = 5;               // current funding rate
  string open_interest = 6;         // open interest
  string prev_day_px = 7;           // price 24h ago (for computing 24h change)
  string day_ntl_vlm = 8;           // 24h notional volume
  string premium = 9;               // premium
  string day_base_vlm = 10;         // 24h base volume
  repeated string impact_pxs = 11;  // impact bid/ask prices
}

// ============================================================================
// Account Request/Response
// ============================================================================

// ----------------------------------------------------------------------------
// GetAccountState
// ----------------------------------------------------------------------------

message GetAccountStateRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
}

message SpotBalance {
  string coin = 1;
  int32 token = 2;
  string total = 3;
  string hold = 4;
}

// PerpsBalance contains the default validator-operated perps USDC balance.
// In Standard mode this balance is separate from spot and HIP-3 DEX balances.
message PerpsBalance {
  string account_value = 1;
  string withdrawable = 2;
  string margin_used = 3;
}

// PerpsDexBalance contains a Standard-mode HIP-3 DEX balance.
message PerpsDexBalance {
  string dex = 1;
  string account_value = 2;
  string withdrawable = 3;
  string margin_used = 4;
}

message GetAccountStateResponse {
  // Balance / margin info
  PerpsMarginSummary margin_summary = 1;
  PerpsMarginSummary cross_margin_summary = 2;
  string withdrawable = 3;
  string cross_maintenance_margin_used = 4;

  // Open positions across all Hyperliquid perp interfaces.
  repeated PerpPosition positions = 5;

  // Open orders across all Hyperliquid perp interfaces.
  repeated PerpOrder open_orders = 6;

  // Builder fee approval status for Oku
  int32 builder_fee_ppm = 7; // max approved fee in parts per million (0 = not approved)
  bool builder_fee_approved = 8;
  string builder_address = 9;

  // Spot USDC balance (unified accounts hold USDC in spot, not perps clearinghouse)
  string spot_usdc_balance = 10;

  // Builder fee config advertised by Oku. The charged fee is attached to orders;
  // the approval target is the max fee users should approve on Hyperliquid.
  int32 builder_fee_charged_ppm = 11;
  int32 builder_fee_approval_target_ppm = 12;

  // All HyperCore spot balances. HyperUnit deposits land here as their native asset (e.g. ETH), not perps margin.
  repeated SpotBalance spot_balances = 13;

  // Hyperliquid account abstraction mode: "default", "unifiedAccount",
  // "portfolioMargin", "disabled", or legacy "dexAbstraction".
  string account_abstraction = 14;

  // Default validator-operated perps balance, excluding HIP-3 DEX balances.
  PerpsBalance perps_balance = 15;

  // Separate balances for supported HIP-3 DEXs in Standard mode.
  repeated PerpsDexBalance hip3_balances = 16;
}

// ----------------------------------------------------------------------------
// GetPerpPositions
// ----------------------------------------------------------------------------

message GetPerpPositionsRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];
}

message GetPerpPositionsResponse {
  // Margin summaries aggregated across the default and supported HIP-3 perp interfaces.
  PerpsMarginSummary margin_summary = 1;
  PerpsMarginSummary cross_margin_summary = 2;
  // Aggregated perps-clearinghouse withdrawable. Unified accounts hold USDC in
  // spot: see GetAccountBalances.spot_usdc_withdrawable for spot withdrawable.
  string withdrawable = 3;
  string cross_maintenance_margin_used = 4;

  // Open positions across all Hyperliquid perp interfaces.
  repeated PerpPosition positions = 5;
}

// ----------------------------------------------------------------------------
// GetOpenOrders
// ----------------------------------------------------------------------------

message GetOpenOrdersRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];

  // Bypass the server-side cache and fetch fresh from Hyperliquid. The cache
  // is refreshed automatically when order executions tracked by Oku finish;
  // use this for explicit user-triggered refreshes.
  bool skip_cache = 2;
}

message GetOpenOrdersResponse {
  // Open orders across all Hyperliquid perp interfaces.
  repeated PerpOrder open_orders = 1;
}

// ----------------------------------------------------------------------------
// GetAccountBalances
// ----------------------------------------------------------------------------

message GetAccountBalancesRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];

  // Bypass the server-side account-mode cache and fetch fresh from
  // Hyperliquid. The mode can be changed on Hyperliquid's own UI; use this on
  // first load and for explicit user-triggered refreshes.
  bool skip_cache = 2;
}

message GetAccountBalancesResponse {
  // All HyperCore spot balances. HyperUnit deposits land here as their native
  // asset (e.g. ETH), not perps margin.
  repeated SpotBalance spot_balances = 1;

  // Spot USDC balance (unified accounts hold USDC in spot, not perps clearinghouse).
  string spot_usdc_balance = 2;

  // Spot USDC total minus hold; empty when the account has no spot USDC balance.
  string spot_usdc_withdrawable = 3;

  // Default validator-operated perps balance in Standard mode.
  PerpsBalance perps_balance = 4;

  // Separate balances for supported HIP-3 DEXs in Standard mode.
  repeated PerpsDexBalance hip3_balances = 5;

  // Hyperliquid account mode used to interpret whether spot and perps balances
  // are separate.
  string account_abstraction = 6;
}

// ----------------------------------------------------------------------------
// GetAccountMode
// ----------------------------------------------------------------------------

message GetAccountModeRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];

  // Bypass the server-side account-mode cache and fetch fresh from
  // Hyperliquid. The mode can be changed on Hyperliquid's own UI; use this on
  // first load and for explicit user-triggered refreshes.
  bool skip_cache = 2;
}

message GetAccountModeResponse {
  // Exact Hyperliquid userAbstraction value. Known values are "default",
  // "disabled", "unifiedAccount", "portfolioMargin", and "dexAbstraction".
  string account_abstraction = 1;
}

// ----------------------------------------------------------------------------
// GetPerpsPnlSummary
// ----------------------------------------------------------------------------

message GetPerpsPnlSummaryRequest {
  string address = 1 [(buf.validate.field).string.(gfxcafe.oku.account.v1.eth_address) = true];

  // Bypass the server-side cache and fetch fresh from Hyperliquid. Honored
  // only for authenticated sessions; anonymous callers always read the cache.
  bool skip_cache = 2;
}

// Each PnL is a decimal USD string from the most recent sample of the matching
// perp* window (perpDay, perpWeek, perpMonth, perpAllTime). Wallets with no
// Hyperliquid history get "0".
message GetPerpsPnlSummaryResponse {
  string day_pnl = 1;
  string week_pnl = 2;
  string month_pnl = 3;
  // Lifetime perps PnL: realized + unrealized.
  string all_time_pnl = 4;
  // Timestamp (ms) of the all-time sample the values were read at; 0 when none.
  int64 as_of_ms = 5;
}

// ----------------------------------------------------------------------------
// GetBuilderFeeStatus
// ----------------------------------------------------------------------------

message GetBuilderFeeStatusRequest {
