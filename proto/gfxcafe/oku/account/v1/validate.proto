syntax = "proto2";

package gfxcafe.oku.account.v1;

import "buf/validate/validate.proto";

option go_package = "gfx.cafe/oku/account/gen/go/gfxcafe/oku/account/v1;v1";

// Custom validation rules for Ethereum-related fields

extend buf.validate.StringRules {
  // Validates Ethereum addresses (0x followed by exactly 40 hex characters)
  optional bool eth_address = 1162 [
    (buf.validate.predefined).cel = {
      id: "string.eth_address"
      expression: "rule && this != '' && !this.matches('^0x[0-9a-fA-F]{40}$') ? 'not a valid Ethereum address: `%s`'.format([this]) : ''"
    }
  ];

  // Validates transaction hashes (0x followed by exactly 64 hex characters)
  optional bool eth_tx_hash = 1163 [
    (buf.validate.predefined).cel = {
      id: "string.eth_tx_hash"
      expression: "rule && this != '' && !this.matches('^0x[0-9a-fA-F]{64}$') ? 'not a valid transaction hash: `%s`'.format([this]) : ''"
    }
  ];

  // Validates hex data (0x followed by any number of hex characters)
  optional bool eth_hex_data = 1164 [
    (buf.validate.predefined).cel = {
      id: "string.eth_hex_data"
      expression: "rule && this != '' && !this.matches('^0x[0-9a-fA-F]*$') ? 'not valid hex data: `%s`'.format([this]) : ''"
    }
  ];
}