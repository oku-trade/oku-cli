syntax = "proto3";

package gfxcafe.oku.account.v1;

option go_package = "gfx.cafe/oku/account/gen/go/gfxcafe/oku/account/v1;v1";

import "gfxcafe/oku/account/v1/common.proto";
import "buf/validate/validate.proto";

// Only the session operations called by Oku CLI are vendored here.
service AuthService {
  rpc PrivySessionExchange(PrivySessionExchangeRequest) returns (PrivySessionExchangeResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ExtendSession(ExtendSessionRequest) returns (ExtendSessionResponse);
}

message PrivySessionExchangeRequest {
  string access_token = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 8192
  ];
}

message PrivySessionExchangeResponse {
  Session session = 1 [(buf.validate.field).required = true];
  User user = 2 [(buf.validate.field).required = true];
}

message ExtendSessionRequest {
  // Empty - uses session from headers
}

message ExtendSessionResponse {
  Session session = 1;
}

message LogoutRequest {
  // Empty - uses session from headers
}

message LogoutResponse {
  bool success = 1;
}
