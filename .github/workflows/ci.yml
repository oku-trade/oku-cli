name: ci
# Cheap per-push check: one Ubicloud linux/amd64 job. The full platform matrix (linux arm64,
# darwin arm64/amd64, packaged-binary smoke) runs only in github-release.yml. Race tests and
# the nix build are dispatch-only in ci-full.yml.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubicloud-standard-2
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      # vet + go test + docs-check (docs/commands.md must match the CLI)
      - run: make test
      - run: go build -o /dev/null ./cmd/oku
      # Regenerates pkg/gen from the vendored proto/ closure and fails on drift. Tool versions
      # pinned: buf v1.73.0; protoc-gen-go via go.mod (go run); protoc-gen-connect-go v1.21.0,
      # the generator that produced the committed pkg/gen (independent of the connect runtime).
      - name: install pinned proto generators
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: protos up to date
        run: ./mise-tasks/sync-protos.sh --check
