name: release
# Manual only. Disabled unless repository variable NPM_PUBLISH_ENABLED == 'true'.
# Even then, the publish job defaults to --dry-run and requires the `npm-release`
# environment (configure required reviewers there). Uses npm trusted publishing (OIDC).
# The source repository is private: npm does NOT generate provenance for private
# repositories, so no --provenance flag is passed and none is claimed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "semver without leading v (e.g. 0.1.0)"
        required: true
      dry_run:
        description: "npm publish --dry-run"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04,     goos: linux,  goarch: amd64, cgo: "0" }
          - { runner: ubuntu-24.04-arm, goos: linux,  goarch: arm64, cgo: "0" }
          - { runner: macos-15-intel,   goos: darwin, goarch: amd64, cgo: "1" }
          - { runner: macos-15,         goos: darwin, goarch: arm64, cgo: "1" }
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: validate version
        run: echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
      - run: make test
      - run: VERSION=v$VERSION PLATFORMS=${{ matrix.goos }}/${{ matrix.goarch }} ./scripts/build.sh
      - name: package + smoke
        run: |
          n=oku_v${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}
          tar -xzf dist/$n.tar.gz -C dist
          ./scripts/npm-pack.sh "$VERSION" npm-dist "${{ matrix.goos }}/${{ matrix.goarch }}=dist/$n/oku"
          ./scripts/npm-smoke.sh npm-dist "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            npm-dist/*.tgz
  publish:
    needs: build   # only after all four native builds and smoke tests pass
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC); no long-lived token
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@^11.5.1   # trusted publishing needs npm >= 11.5.1
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: release-*, merge-multiple: true }
      - name: publish platform packages, then launcher
        env:
          VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          cd artifacts/npm-dist
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            test -f "oku-trade-cli-$p-$VERSION.tgz"
          done
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            npm publish $DRY --access restricted "oku-trade-cli-$p-$VERSION.tgz"
          done
          npm publish $DRY --access restricted "oku-trade-cli-$VERSION.tgz"
