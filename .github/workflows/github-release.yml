name: github-release
# Builds all four targets (linux natively on Ubicloud x86/arm, darwin arm64 natively and
# darwin/amd64 cross-compiled on one Namespace mac), smoke-tests them, and publishes a GitHub Release with
# oku_<tag>_<os>_<arch>.tar.gz archives plus a combined SHA256SUMS.
# Trigger: push a semver tag (git tag v0.1.0 && git push origin v0.1.0), or re-run for an
# existing tag via workflow_dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build and publish, e.g. v0.1.0"
        required: true
      npm_dry_run:
        description: "pack npm packages without staging them"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  validate:
    runs-on: ubicloud-standard-2
    steps:
      - name: tag must be semver (vMAJOR.MINOR.PATCH[-pre])
        run: |
          echo "tag: $TAG"
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' \
            || { echo "tag '$TAG' is not semver (expected vX.Y.Z or vX.Y.Z-pre)" >&2; exit 1; }
  build-linux:
    needs: validate
    name: build linux/${{ matrix.goarch }}
    strategy:
      fail-fast: true
      matrix:
        # Ubicloud labels per https://www.ubicloud.com/docs/github-actions-integration/runner-types
        # (ubicloud-standard-2 = 2 vCPU x64, ubicloud-standard-2-arm = 2 vCPU arm64, Ubuntu 24.04).
        include:
          - { runner: ubicloud-standard-2,     goarch: amd64 }
          - { runner: ubicloud-standard-2-arm, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", check-latest: true, cache: true }
      - name: assert native host
        run: test "$(go env GOOS)/$(go env GOARCH)" = "linux/${{ matrix.goarch }}"
      - run: make test
      - name: build archive (version stamped from tag)
        run: VERSION="$TAG" PLATFORMS=linux/${{ matrix.goarch }} ./mise-tasks/dist.sh
      - name: smoke packaged binary
        run: |
          set -euo pipefail
          n="oku_${TAG}_linux_${{ matrix.goarch }}"
          mkdir -p smoke
          tar -xzf "dist/$n.tar.gz" -C smoke
          bin="smoke/$n/oku"
          tar -tzf "dist/$n.tar.gz" | grep >/dev/null '/THIRD_PARTY_NOTICES$'
          ./mise-tasks/binary-smoke.sh "$bin"
          "$bin" version | tee version.txt
          grep -qF "$TAG" version.txt || { echo "oku version does not report $TAG" >&2; exit 1; }
          file "$bin" | grep >/dev/null 'statically linked' || { echo "linux binary not static" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: gh-release-linux-${{ matrix.goarch }}
          path: dist/oku_${{ env.TAG }}_linux_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
  build-darwin:
    needs: validate
    name: build darwin/arm64 + darwin/amd64
    # Namespace macOS (Apple Silicon). Override the label with
    # the OKU_MACOS_RUNNER repo variable. darwin/amd64 is cross-compiled here with CGO
    # (clang -arch x86_64, OKU_DARWIN_CROSS=1 in dist.sh); no Intel runner.
    runs-on: ${{ vars.OKU_MACOS_RUNNER || 'namespace-profile-ios' }}
    # Signing secrets live in the `release` environment, which only v* tags may deploy to.
    environment: release
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", check-latest: true, cache: true }
      - name: preflight (macOS arm64, Xcode CLT, clang, go)
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p || { echo "no Xcode/CLT on runner: install Xcode command line tools in the profile" >&2; exit 1; }
          clang --version || { echo "clang missing on runner" >&2; exit 1; }
          xcrun --sdk macosx --show-sdk-path || { echo "macOS SDK missing (xcrun)" >&2; exit 1; }
          go version
          test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64 || { echo "expected an Apple Silicon runner, got $(go env GOOS)/$(go env GOARCH)" >&2; exit 1; }
      - name: test (darwin/arm64, disposable keychain; never the login keychain)
        env: { OKU_KEYCHAIN_TEST_ACK: disposable-runner }
        run: ./mise-tasks/macos-keychain-test.sh make test
      - name: import Developer ID certificate (skipped without secrets; builds stay ad-hoc signed)
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12" ]; then echo "no signing secrets: ad-hoc signing only"; exit 0; fi
          test -n "$CERT_PASSWORD" || { echo "MACOS_DEVELOPER_ID_P12_PASSWORD is empty in the release environment" >&2; exit 1; }
          kc="$RUNNER_TEMP/oku-signing.keychain-db"; kcpw="$(openssl rand -hex 24)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          id="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$id" || { echo "no Developer ID Application identity in the p12" >&2; exit 1; }
          echo "identity=$id" >> "$GITHUB_OUTPUT"
          echo "keychain=$kc" >> "$GITHUB_OUTPUT"
          if [ -n "$NOTARY_KEY" ]; then
            [[ "$NOTARY_ISSUER" =~ ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$ ]] \
              || { echo "APPLE_NOTARY_ISSUER_ID is not a UUID (length ${#NOTARY_ISSUER})" >&2; exit 1; }
            [[ "$NOTARY_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] \
              || { echo "APPLE_NOTARY_KEY_ID is not a 10-character key ID (length ${#NOTARY_KEY_ID})" >&2; exit 1; }
            printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            echo "notary_key=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"
          fi
      - name: build archives (version stamped from tag)
        env:
          OKU_DARWIN_CROSS: "1"
          OKU_CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          OKU_NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary_key }}
          OKU_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          OKU_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: VERSION="$TAG" PLATFORMS="darwin/arm64 darwin/amd64" ./mise-tasks/dist.sh
      - name: remove signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: smoke packaged binaries
        run: |
          set -euo pipefail
          rosetta=0
          if arch -x86_64 /usr/bin/true 2>/dev/null; then rosetta=1; fi
          for arch in arm64 amd64; do
            n="oku_${TAG}_darwin_${arch}"
            mkdir -p smoke
            tar -xzf "dist/$n.tar.gz" -C smoke
            bin="smoke/$n/oku"
            tar -tzf "dist/$n.tar.gz" | grep >/dev/null '/THIRD_PARTY_NOTICES$'
            file "$bin"
            want=$arch; [ "$arch" = amd64 ] && want=x86_64
            test "$(lipo -archs "$bin")" = "$want" || { echo "$bin: expected arch $want, got $(lipo -archs "$bin")" >&2; exit 1; }
            otool -L "$bin" | grep >/dev/null Security.framework || { echo "$bin lacks Security.framework" >&2; exit 1; }
            codesign --verify --strict --verbose=2 "$bin"
            run=()
            if [ "$arch" = amd64 ]; then
              if [ "$rosetta" = 1 ]; then run=(arch -x86_64); else echo "rosetta unavailable: skipping darwin/amd64 exec smoke (static checks passed)"; continue; fi
            fi
            if [ "${#run[@]}" -gt 0 ]; then
              printf '#!/bin/sh\nexec arch -x86_64 "%s" "$@"\n' "$PWD/$bin" > "smoke/oku-x86"
              chmod +x smoke/oku-x86
              ./mise-tasks/binary-smoke.sh smoke/oku-x86
              "${run[@]}" "$bin" version | tee version.txt
            else
              ./mise-tasks/binary-smoke.sh "$bin"
              "$bin" version | tee version.txt
            fi
            grep -qF "$TAG" version.txt || { echo "oku version does not report $TAG" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gh-release-darwin-arm64
          path: dist/oku_${{ env.TAG }}_darwin_arm64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gh-release-darwin-amd64
          path: dist/oku_${{ env.TAG }}_darwin_amd64.tar.gz
          if-no-files-found: error
  package-linux:
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/download-artifact@v4
        with: { path: release, pattern: gh-release-linux-*, merge-multiple: true }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x", check-latest: true }
      - name: install pinned nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - name: package and smoke Linux deb/rpm
        run: |
          set -euo pipefail
          version="${TAG#v}"
          amd64_archive="oku_${TAG}_linux_amd64"
          tar -xzf "release/$amd64_archive.tar.gz" -C release
          mkdir -p packaging/completions
          "release/$amd64_archive/oku" completion bash > packaging/completions/oku
          "release/$amd64_archive/oku" completion zsh > packaging/completions/_oku
          "release/$amd64_archive/oku" completion fish > packaging/completions/oku.fish
          grep -q '^#compdef oku' packaging/completions/_oku
          for arch in amd64 arm64; do
            archive="oku_${TAG}_linux_${arch}"
            if [ "$arch" != amd64 ]; then tar -xzf "release/$archive.tar.gz" -C release; fi
            mkdir -p packaging/binary
            install -m755 "release/$archive/oku" packaging/binary/oku
            export OKU_ARCH="$arch" OKU_VERSION="$version"
            nfpm pkg -f packaging/nfpm.yaml -p deb -t "release/oku_${version}_linux_${arch}.deb"
            rpmarch=x86_64; [ "$arch" = arm64 ] && rpmarch=aarch64
            nfpm pkg -f packaging/nfpm.yaml -p rpm -t "release/oku-${version}-1.${rpmarch}.rpm"
          done
          test_completions='test -s /usr/share/bash-completion/completions/oku && test -s /usr/share/zsh/site-functions/_oku && test -s /usr/share/fish/vendor_completions.d/oku.fish'
          docker run --rm -v "$PWD/release:/release:ro" debian:stable-slim sh -ec \
            "apt install -y /release/oku_${version}_linux_amd64.deb && oku version | grep -F '$TAG' && $test_completions"
          docker run --rm -v "$PWD/release:/release:ro" fedora:latest sh -ec \
            "dnf install -y /release/oku-${version}-1.x86_64.rpm && oku version | grep -F '$TAG' && $test_completions"
      - uses: actions/upload-artifact@v4
        with:
          name: gh-release-packages
          path: |
            release/*.deb
            release/*.rpm
          if-no-files-found: error
  publish:
    needs: [build-linux, build-darwin, package-linux]
    runs-on: ubicloud-standard-2
    permissions:
      contents: write   # create the release and upload assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, pattern: gh-release-*, merge-multiple: true }
      - name: require all four targets + combined SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            test -s "oku_${TAG}_${t}.tar.gz" || { echo "missing oku_${TAG}_${t}.tar.gz" >&2; exit 1; }
          done
          set -- ./*.tar.gz ./*.deb ./*.rpm
          test "$#" = 8 || { ls -l; echo "expected four archives and four OS packages" >&2; exit 1; }
          sha256sum -- *.tar.gz *.deb *.rpm > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: create or update GitHub Release
        run: |
          set -euo pipefail
          cd release
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing assets"
            gh release upload "$TAG" --clobber -- *.tar.gz *.deb *.rpm SHA256SUMS
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${pre[@]}" \
              -- *.tar.gz *.deb *.rpm SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        with: { name: sha256sums, path: release/SHA256SUMS, if-no-files-found: error }
  homebrew-tap:
    # Updates Formula/oku.rb in oku-trade/homebrew-tap. Stable tags only. Authenticates as the org
    # GitHub App (APP_ID / APP_PRIVATE_KEY) with a token scoped to the tap
    # repo; the app needs Contents read/write and access to homebrew-tap. Skipped if the secrets are absent.
    needs: publish
    environment: release
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    runs-on: ubicloud-standard-2
    env:
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: require app credentials
        id: gate
        run: |
          if [ "$HAS_APP" != true ]; then echo "APP_ID/APP_PRIVATE_KEY not available; skipping tap update"; echo "run=false" >> "$GITHUB_OUTPUT"
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/create-github-app-token@v2
        id: app
        if: steps.gate.outputs.run == 'true'
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: oku-trade
          repositories: homebrew-tap
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with: { ref: "refs/tags/${{ env.TAG }}", path: src }
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with: { repository: oku-trade/homebrew-tap, token: "${{ steps.app.outputs.token }}", path: tap }
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with: { name: sha256sums, path: sums }
      - name: render and push formula
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          src/mise-tasks/brew-formula.sh "$TAG" sums/SHA256SUMS > tap/Formula/oku.rb
          cd tap
          git add Formula/oku.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "oku ${TAG#v}"
          git push
  npm:
    needs: publish
    environment: release
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      NPM_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
    steps:
      - name: check npm publishing configuration
        id: gate
        run: |
          if [ "$NPM_ENABLED" != true ]; then
            echo 'NPM_PUBLISH_ENABLED is not true; skipping npm staging'
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else echo 'run=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with: { path: release, pattern: gh-release-*, merge-multiple: true }
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with: { name: sha256sums, path: release }
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: '24', registry-url: 'https://registry.npmjs.org' }
      - name: pack and smoke signed release binaries
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          mkdir -p extracted
          args=()
          for os in linux darwin; do
            for arch in amd64 arm64; do
              archive="oku_${TAG}_${os}_${arch}"
              tar -xzf "release/$archive.tar.gz" -C extracted
              args+=("$os/$arch=extracted/$archive/oku")
            done
          done
          ./mise-tasks/npm-pack.sh "${TAG#v}" npm-dist "${args[@]}"
          ./mise-tasks/npm-smoke.sh npm-dist "${TAG#v}"
      - name: stage platform packages, then launcher
        if: steps.gate.outputs.run == 'true'
        env:
          DRY_RUN: ${{ inputs.npm_dry_run || 'false' }}
        run: |
          set -euo pipefail
          npm install -g 'npm@^11.19'
          npm --version
          version="${TAG#v}"
          stage_package() {
            local name="$1" tarball="$2"
            if [ "$DRY_RUN" = true ]; then
              npm stage publish "$tarball" --dry-run --access public --tag latest
              return
            fi
            if npm view "$name@$version" version --json > "$RUNNER_TEMP/npm-view.out" 2> "$RUNNER_TEMP/npm-view.err"; then
              echo "$name@$version already published; skipping"
              return
            fi
            if ! grep -Eq 'E404|404 Not Found' "$RUNNER_TEMP/npm-view.err"; then
              echo "registry lookup failed for $name@$version" >&2
              return 1
            fi
            npm stage publish "$tarball" --provenance --access public --tag latest
          }
          for os in linux darwin; do
            for arch in x64 arm64; do
              name="@gfxlabs/oku-cli-$os-$arch"
              tarball="./npm-dist/gfxlabs-oku-cli-$os-$arch-$version.tgz"
              stage_package "$name" "$tarball"
            done
          done
          stage_package '@gfxlabs/oku-cli' "./npm-dist/gfxlabs-oku-cli-$version.tgz"
          echo 'Approve all four platform packages before the launcher on npmjs.com.'
  aur:
    needs: publish
    environment: release
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    env:
      HAS_AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - name: check AUR credentials
        id: gate
        run: |
          if [ "$HAS_AUR_KEY" != true ]; then
            echo 'AUR_SSH_PRIVATE_KEY absent; skipping AUR update'
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else echo 'run=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with: { ref: "refs/tags/${{ env.TAG }}", path: src }
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with: { name: sha256sums, path: sums }
      - name: render and push AUR metadata
        if: steps.gate.outputs.run == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_GIT_NAME: ${{ vars.AUR_GIT_NAME || 'oku release bot' }}
          AUR_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL || 'oku-release-bot@users.noreply.github.com' }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/aur_key"
          printf '%s\n' "$AUR_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/src/packaging/aur_known_hosts"
          git clone ssh://aur@aur.archlinux.org/oku-bin.git aur-repo
          bash src/mise-tasks/aur-pkgbuild.sh "$TAG" sums/SHA256SUMS aur-repo
          bash src/mise-tasks/aur-check.sh aur-repo/PKGBUILD aur-repo/.SRCINFO
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo 'AUR metadata unchanged'; exit 0; fi
          git -c user.name="$AUR_GIT_NAME" -c user.email="$AUR_GIT_EMAIL" commit -m "oku-bin ${TAG#v}"
          git push
